[project]
name = "bidr"
version = "0.1.0.dev0"
description = "Birim İç Değerlendirme Raporu (BİDR) için kanıt tarama, sınıflandırma ve rapor yazım aracı (model bağımsız)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "jsonschema>=4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bidr = "bidr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
