[project]
name = "bidr"
version = "0.1.0.dev0"
description = "Birim İç Değerlendirme Raporu (BİDR) için kanıt tarama, sınıflandırma ve rapor yazım aracı (model bağımsız)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-pptx>=0.6.23",
  "jsonschema>=4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlwt>=1.3"]
# Outlook .msg e-postaları (yoksa .msg "desteklenmeyen" kaydı olur)
msg = ["extract-msg>=0.48"]
# kişisel veri maskeleme: PDF'te gerçek kaldırma (redaction, taranmış sayfada görüntü pikselleri dahil);
# yoksa pypdf ile en iyi çaba. AGPL olduğu için isteğe bağlı. OCR için sistemde tesseract (tur+eng) gerekir.
# numpy: el yazısı form alanı yapısı (kılavuz/tarak/tablo), rakam dizisi ve şablon belleği.
maske = ["pymupdf>=1.24.2", "numpy>=1.24"]

[project.scripts]
bidr = "bidr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
