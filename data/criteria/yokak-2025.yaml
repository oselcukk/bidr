- id: C.3.1
  title: Araştırma performansının izlenmesi ve değerlendirilmesi
  parent: C.3
  description:
  - Birim araştırma faaliyetleri yıllık bazda izlenir, değerlendirilir, hedeflerle karşılaştırılır ve sapmaların nedenleri irdelenir.
  - Birimin odak alanlarının üniversite içi bilinirliği, üniversite dışı bilinirliği; uluslararası görünürlük, uzmanlık iddiası konularının analizi, hedeflerle uyumu sistematik olarak analiz edilir.
  - Performans temelinde teşvik ve takdir mekanizmaları kullanılır.
  - Rakiplerle rekabet, seçilmiş kurumlarla kıyaslama (benchmarking) takip edilir.
  - Performans değerlendirmelerinin sistematik ve kalıcı olması sağlanmaktadır.
