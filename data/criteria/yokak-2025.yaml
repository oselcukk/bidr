criteria:
- id: A.1
  title: Liderlik ve Kalite
  parent: A
  description:
  - Birim birimsel dönüşümünü sağlayacak yönetişim modeline sahip olmalı, liderlik yaklaşımları uygulamalı, iç kalite güvence mekanizmalarını oluşturmalı ve kalite güvence kültürünü içselleştirmelidir.
- id: A.2
  title: Misyon ve Stratejik Amaçlar
  parent: A
  description:
  - Birim; vizyon, misyon ve amacını gerçekleştirmek üzere politikaları doğrultusunda oluşturduğu stratejik amaçlarını ve hedeflerini planlayarak uygulamalı, performans yönetimi kapsamında sonuçlarını izleyerek değerlendirmeli ve kamuoyuyla paylaşmalıdır.
- id: A.3
  title: Yönetim Sistemleri
  parent: A
  description:
  - Birim, stratejik hedeflerine ulaşmayı nitelik ve nicelik olarak güvence altına almak amacıyla mali, beşerî ve bilgi kaynakları ile süreçlerini yönetmek üzere bir sisteme sahip olmalıdır.
- id: A.4
  title: Paydaş Katılımı
  parent: A
  description:
  - Birim, iç ve dış paydaşlarının stratejik kararlara ve süreçlere katılımını sağlamak üzere geri bildirimlerini almak, yanıtlamak ve kararlarında kullanmak için gerekli sistemleri oluşturmalı ve yönetmelidir.
- id: A.5
  title: Uluslararasılaşma
  parent: A
  description:
  - Birim/Kurum, uluslararasılaşma stratejisi ve hedefleri doğrultusunda süreçlerini yönetmeli, organizasyonel yapılanmasını oluşturmalı ve sonuçlarını periyodik olarak izleyerek değerlendirmelidir.
- id: B.1
  title: Program Tasarımı, Değerlendirmesi ve Güncellenmesi
  parent: B
  description:
  - Birim, öğretim programlarını Türkiye Yükseköğretim Yeterlilikleri Çerçevesi ile uyumlu; öğretim amaçlarına ve öğrenme çıktılarına uygun olarak tasarlamalı, öğrencilerin ve toplumun ihtiyaçlarına cevap verdiğinden emin olmak için periyodik olarak değerlendirmeli ve güncellemelidir.
- id: B.2
  title: Programların Yürütülmesi (Öğrenci Merkezli Öğrenme, Öğretme ve Değerlendirme)
  parent: B
  description:
  - Birim, hedeflediği nitelikli mezun yeterliliklerine ulaşmak amacıyla öğrenci merkezli ve yetkinlik temelli öğretim, ölçme ve değerlendirme yöntemlerini uygulamalıdır. Birim, öğrenci kabulleri, diploma, derece ve diğer yeterliliklerin tanınması ve sertifikalandırılmasına yönelik açık kriterler belirlemeli; önceden tanımlanmış ve ilan edilmiş kuralları tutarlı şekilde uygulamalıdır.
- id: B.3
  title: Öğrenme Kaynakları ve Akademik Destek Hizmetleri
  parent: B
  description:
  - Birim/Kurum, hedeflediği nitelikli mezun yeterliliklerine ulaşmak ve eğitim- öğretim faaliyetlerini yürütmek için uygun altyapıya, kaynaklara ve ortamlara sahip olmalı ve öğrenme olanaklarının tüm öğrenciler için yeterli ve erişilebilir olmasını güvence altına almalıdır. Birim/Kurum öğrencilerin akademik gelişimi ve kariyer planlamasına yönelik destek hizmetleri sağlamalıdır.
- id: B.4
  title: Öğretim Kadrosu
  parent: B
  description:
  - Birim, öğretim elemanlarının işe alınması, atanması, yükseltilmesi ve ders görevlendirmesi ile ilgili tüm süreçlerde adil ve açık olmalıdır. Hedeflenen nitelikli mezun yeterliliklerine ulaşmak amacıyla, öğretim elemanlarının eğitim-öğretim yetkinliklerini sürekli geliştirmek için olanaklar sunmalıdır.
- id: C.1
  title: Araştırma Süreçlerinin Yönetimi ve Araştırma Kaynakları
  parent: C
  description:
  - Birim, araştırma faaliyetlerini kurumun stratejik planı çerçevesinde belirlenen akademik öncelikleri ile yerel, bölgesel ve ulusal kalkınma hedefleriyle uyumlu, değer üretebilen ve toplumsal faydaya dönüştürülebilen biçimde yönetmelidir. Bu faaliyetler için uygun fiziki altyapı ve mali kaynaklar oluşturmalı ve bunların etkin şekilde kullanımını sağlamalıdır.
- id: C.2
  title: Araştırma Yetkinliği, İş birlikleri ve Destekler
  parent: C
  description:
  - Birim, öğretim elemanları ve araştırmacıların bilimsel araştırma ve sanat yetkinliğini sürdürmek ve iyileştirmek için olanaklar (eğitim, iş birlikleri, destekler vb.) sunmalıdır.
- id: C.3
  title: Araştırma Performansı
  parent: C
  description:
  - Birim, araştırma faaliyetlerini verilere dayalı ve periyodik olarak ölçmeli, değerlendirmeli ve sonuçlarını yayımlamalıdır. Elde edilen bulgular, Birimin araştırma ve geliştirme performansının periyodik olarak gözden geçirilmesi ve sürekli iyileştirilmesi için kullanılmalıdır.
- id: D.1
  title: Toplumsal Katkı Süreçlerinin Yönetimi ve Toplumsal Katkı Kaynakları
  parent: D
  description:
  - Birim/Kurum, toplumsal katkı faaliyetlerini stratejik amaçları ve hedefleri doğrultusunda yönetmelidir. Bu faaliyetler için uygun fiziki altyapı ve mali kaynaklar oluşturmalı ve bunların etkin şekilde kullanımını sağlamalıdır.
- id: D.2
  title: Toplumsal Katkı Performansı
  parent: D
  description:
  - Birim/Kurum, toplumsal katkı stratejisi ve hedefleri doğrultusunda yürüttüğü faaliyetleri periyodik olarak izlemeli ve sürekli iyileştirmelidir.
sub_criteria:
- id: A.1.1
  title: Yönetişim modeli ve idari yapı
  parent: A.1
  description:
  - Birimdeki yönetişim modeli ve idari yapı (yasal düzenlemeler çerçevesinde kurumsal yaklaşım, gelenekler, tercihler); karar verme mekanizmaları, kontrol ve denge unsurları; kurulların çok sesliliği ve bağımsız hareket kabiliyeti, paydaşların temsil edilmesi; öngörülen yönetişim modeli ile gerçekleşmenin karşılaştırılması, modelin kurumsallığı ve sürekliliği yerleşmiş ve benimsenmiştir.
  - Rektör yardımcıları ve danışmanlarının (üst yönetimin) çalışma tarzı, yetki ve sorumlulukları, kurumun akademik camiasıyla iletişimi; üst yönetim tarzının hedeflenen kurum kimliği ile uyumu yerleşmiş ve benimsenmiştir.
  - Organizasyon şeması ve bağlı olma/rapor verme ilişkileri; görev tanımları, iş akış süreçleri vardır ve gerçeği yansıtmaktadır; ayrıca bunlar yayımlanmış ve işleyişin paydaşlarca bilinirliği sağlanmıştır.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimin misyonuyla uyumlu ve stratejik hedeflerini gerçekleştirmeyi sağlayacak bir yönetişim modeli ve organizasyonel yapılanması bulunmamaktadır.
    2: Birimin misyon ve stratejik hedeflerine ulaşmasını güvence altına alan ve süreçleriyle uyumlu yönetişim modeli ve idari yapılanması belirlenmiştir.
    3: Birimin yönetişim modeli ve organizasyonel yapılanması birim ve alanların genelini kapsayacak şekilde faaliyet göstermektedir.
    4: Birimin yönetişim ve organizasyonel yapılanmasına ilişkin uygulamaları izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Yönetişim modeli ve organizasyon şeması
  - Birimin yönetişim ve idari alanlarla ilgili politikasını ve stratejik amaçlarını uyguladığına dair uygulamalar/kanıtlar
  - Yönetişim ve organizasyonel yapılanma uygulamalarına ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.1.2
  title: Liderlik
  parent: A.1
  description:
  - Kurumda rektörün ve süreç liderlerinin yükseköğretim ekosistemindeki değişim, belirsizlik ve karmaşıklığı dikkate alan bir kalite güvencesi sistemi ve kültürü oluşturma konusunda sahipliği ve motivasyonu yüksektir. Bu süreçler çevik bir liderlik yaklaşımıyla yönetilmektedir.
  - Birimlerde liderlik anlayışı ve koordinasyon kültürü yerleşmiştir. Liderler kurumun değerleri ve hedefleri doğrultusunda stratejilerinin yanı sıra; yetki paylaşımını, ilişkileri, zamanı, kurumsal motivasyon ve stresi de etkin ve dengeli biçimde yönetmektedir.
  - Akademik ve idari birimler ile yönetim arasında etkin bir iletişim ağı oluşturulmuştur.
  - Liderlik süreçleri ve kalite güvencesi kültürünün içselleştirilmesi sürekli değerlendirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimde kalite güvencesi sisteminin yönetilmesi ve kalite kültürünün içselleştirilmesini destekleyen etkin bir liderlik yaklaşımı bulunmamaktadır.
    2: Birimde liderlerin kalite güvencesi sisteminin yönetimi ve kültürünün içselleştirilmesi konusunda sahipliği ve motivasyonu bulunmaktadır.
    3: Birimin geneline yayılmış, kalite güvencesi sistemi ve kültürünün gelişimini destekleyen etkin liderlik uygulamaları bulunmaktadır.
    4: Liderlik uygulamaları ve bu uygulamaların kalite güvencesi sistemi ve kültürünün gelişimine katkısı izlenmekte ve bağlı iyileştirmeler gerçekleştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Kurumun yöneticilerinin liderlik özelliklerini ve yetkinliklerini ölçmek ve izlemek için kullanılan yöntemler, elde edilen izleme sonuçları ve bağlı iyileştirmeler
  - Kurumdaki kalite kültürünün gelişimini ölçmek ve izlemek için kullanılan yöntemler, elde edilen izleme sonuçları ve bağlı iyileştirmeler
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.1.3
  title: Kurumsal dönüşüm kapasitesi
  parent: A.1
  description:
  - Yükseköğretim ekosistemi içerisindeki değişimleri, küresel eğilimleri, ulusal hedefleri ve paydaş beklentilerini dikkate alarak kurumun/birimin geleceğe hazır olmasını sağlayan çevik yönetim yetkinliği vardır.
  - Geleceğe uyum için amaç, misyon ve hedefler doğrultusunda kurumu/birimi dönüştürmek üzere değişim yönetimi, kıyaslama, yenilik yönetimi gibi yaklaşımları kullanır ve kurumsal/birimsel özgünlüğü güçlendirir.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimde değişim yönetimi bulunmamaktadır.
    2: Birimde değişim ihtiyacı olgunluk seviyesinde belirlenmiştir.
    3: Birimde değişim yönetimi yaklaşımı Birimin geneline yayılmış ve bütüncül olarak yürütülmektedir
    4: Amaç, misyon ve hedefler doğrultusunda gerçekleştirilen değişim yönetimi uygulamaları izlenmekte ve önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır
  example_evidence:
  - Değişim yönetim modeli
  - Değişim planları, yol haritaları
  - Yükseköğretim ekosisteminde ve temel fonksiyonları çevresinde meydana gelen değişime yönelik analiz raporları
  - Gelecek senaryoları
  - Kıyaslama raporları
  - Yenilik yönetim sistemi
  - Değişim ekipleri belgeleri
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.1.4
  title: İç kalite güvencesi mekanizmaları
  parent: A.1
  description:
  - PUKÖ çevrimleri itibarı ile takvim yılı temelinde hangi işlem, süreç, mekanizmaların devreye gireceği planlanmış, akış şemaları belirlidir. Sorumluluklar ve yetkiler tanımlanmıştır. Gerçekleşen uygulamalar değerlendirilmektedir.
  - Takvim yılı temelinde tasarlanmayan diğer kalite döngülerinin ise tüm katmanları içerdiği kanıtları ile belirtilmiştir, gerçekleşen uygulamalar değerlendirilmektedir.
  - Kuruma ait kalite güvencesi rehberi gibi, politika ayrıntılarının yer aldığı erişilebilen ve güncellenen bir doküman bulunmaktadır.
  - Kurumun Kalite Komisyonunun süreç ve uygulamaları tanımlıdır, kurum çalışanlarınca bilinir. Komisyon iç kalite güvencesi sisteminin oluşturulması ve geliştirilmesinde etkin rol alır, program akreditasyonu süreçlerine destek verir. Komisyon gerçekleştirilen etkinliklerin sonuçlarını değerlendirir. Bu değerlendirmeler karar alma mekanizmalarını etkiler.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimin tanımlanmış bir iç kalite güvencesi sistemi bulunmamaktadır.
    2: Birimin iç kalite güvencesi süreç ve mekanizmaları tanımlanmıştır.
    3: İç kalite güvencesi sistemi Birimin geneline yayılmış, şeffaf ve bütüncül olarak yürütülmektedir
    4: İç kalite güvencesi sistemi mekanizmaları izlenmekte ve ilgili paydaşlarla birlikte iyileştirilmektedir
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Kalite güvencesi rehberi gibi tanımlı süreç belgeleri, Kalite Komisyonu çalışma usul ve esasları
  - İş akış şemaları, takvim, görev ve sorumluluklar ve paydaşların rollerini gösteren kanıtlar
  - Bilgi Yönetim Sistemi
  - Kurumsal Risk Yönetim Planı
  - Geri bildirim yöntemleri
  - Paydaş katılımına ilişkin belgeler
  - Yıllık izleme ve iyileştirme raporları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.1.5
  title: Kamuoyu Bilgilendirme ve Hesap Verilebilirlik
  parent: A.1
  description:
  - Kamuoyunu bilgilendirme ilkesel olarak benimsenmiştir, hangi kanalların nasıl kullanılacağı tasarlanmıştır, erişilebilir olarak ilan edilmiştir ve tüm bilgilendirme adımları sistematik olarak atılmaktadır.
  - Birim web sayfası doğru, güncel, ilgili ve kolayca erişilebilir bilgiyi vermektedir; bunun sağlanması için gerekli mekanizma mevcuttur.
  - Kurumsal özerklik ile hesap verebilirlik kavramlarının birbirini tamamladığına ilişkin bulgular mevcuttur.
  - İçe ve dışa hesap verme yöntemleri kurgulanmıştır ve uygulanmaktadır. Sistematiktir, ilan edilen takvim çerçevesinde gerçekleştirilir, sorumluları nettir. Alınan geri beslemeler ile etkinliği değerlendirilmektedir.
  - Kurumun bölgesindeki dış paydaşları, ilişkili olduğu yerel yönetimler, diğer üniversiteler, kamu kurumu kuruluşları, sivil toplum kuruluşları, sanayi ve yerel halk ile ilişkileri değerlendirilmektedir.
  units: TÜM AKADEMİK VE İDARİ BİRİMLER, ÜST YÖNETİM, GENEL SERETERLİK, STRATEJİ GELİŞTİRME D. B., BASIN HALKLA İLİŞKİLER M.
  rubric:
    1: Birimde kamuoyunu bilgilendirmek ve hesap verebilirliği gerçekleştirmek üzere mekanizmalar bulunmamaktadır.
    2: Birimde şeffaflık ve hesap verebilirlik ilkeleri doğrultusunda kamuoyunu bilgilendirmek üzere tanımlı süreçler bulunmaktadır
    3: Birim tanımlı süreçleri doğrultusunda kamuoyunu bilgilendirme ve hesap verebilirlik mekanizmalarını işletmektedir.
    4: Birimin kamuoyunu bilgilendirme ve hesap verebilirlik mekanizmaları izlenmekte ve paydaş görüşleri doğrultusunda iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır
  example_evidence:
  - Kamuoyunu bilgilendirme ve hesap verebilirlik ile ilişkili olarak benimsenen ilke, kural, yöntemler ve bilgilendirme adımlarının ilan edildiğini gösteren kanıtlar
  - Kurumun/birimlerin internet sayfalarının güncel ve erişilebilir olduğuna dair kanıtlar
  - Kurum içi ve dışı hesap verebilirlik tanımlı süreçlerinin uygulanmakta olduğunu gösteren kanıtlar
  - İç ve dış paydaşların kamuoyunu bilgilendirme ve hesap verebilirlikle ilgili memnuniyeti ve geri bildirimleri
  - Kamuoyunu bilgilendirme ve hesap verebilirlik mekanizmalarına ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.2.1
  title: Misyon, vizyon ve politikalar
  parent: A.2
  description:
  - Misyon ve vizyon ifadesi tanımlanmıştır, birim çalışanlarınca bilinir ve paylaşılır. Kuruma/Birime özeldir, sürdürülebilir bir gelecek yaratmak için yol göstericidir.
  - Kalite güvencesi politikası vardır, paydaşların görüşü alınarak hazırlanmıştır. Politika birim çalışanlarınca bilinir ve paylaşılır. Politika belgesi yalın, somut, gerçekçidir. Sürdürülebilir kalite güvencesi sistemini ana hatlarıyla tarif etmektedir. Kalite güvencesinin yönetim şekli, yapılanması, temel mekanizmaları, merkezi kurgu ve birimlere erişimi açıklanmıştır.
  - Aynı şekilde eğitim ve öğretim (uzaktan eğitimi de kapsayacak şekilde), araştırma ve geliştirme, toplumsal katkı, yönetişim sistemi ve uluslararasılaşma politikaları vardır ve kalite güvencesi politikası için sayılan özellikleri taşır. Bu politika ifadelerinin somut sonuçları, uygulamalara yansıyan etkileri vardır; örnekleri sunulabilir.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimde tanımlanmış misyon, vizyon  ve politikalar bulunmamaktadır
    2: Birimin tanımlanmış ve Birime özgü misyon, vizyon ve politikaları bulunmaktadır.
    3: Birimin genelinde misyon, vizyon ve politikalarla uyumlu uygulamalar bulunmaktadır.
    4: Misyon, vizyon ve politikalar doğrultusunda gerçekleştirilen uygulamalar izlenmekte ve paydaşlarla birlikte değerlendirilerek önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Misyon ve vizyon
  - Politika belgeleri (Eğitim ve öğretim politika belgesi uzaktan eğitimi de içermelidir)
  - Politika belgelerinin ilgili paydaş katılımıyla hazırlandığını kanıtlayan belgeler
  - Politika belgelerinde bütüncül ilişkiyi gösteren ifadeler ve uygulama örnekleri (Eğitim programlarında araştırma vurgusu, araştırma süreçlerinde topluma hizmet vurgusu, uzaktan eğitim vurgusu)
  - Politikaların izlendiğine ve değerlendirildiğine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.2.2
  title: Stratejik amaç ve hedefler
  parent: A.2
  description:
  - Stratejik Plan; kültürü̈ ve geleneği vardır, mevcut dönemi kapsayan, kısa/orta uzun vadeli amaçlar, hedefler, alt hedefler, eylemler ve bunların zamanlaması, önceliklendirilmesi, sorumluları, mali kaynakları bulunmaktadır, tüm paydaşların görüşü alınarak (özellikle stratejik paydaşlar) hazırlanmıştır.
  - Mevcut stratejik plan hazırlanırken bir öncekinin ayrıntılı değerlendirilmesi yapılmış̧ ve kullanılmıştır; yıllık gerçekleşme takip edilerek ilgili kurullarda tartışılmakta ve gerekli önlemler alınmaktadır.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Kurumun stratejik planı bulunmamaktadır.
    2: Kurumun ilan edilmiş bir stratejik planı bulunmaktadır.
    3: Kurumun bütünsel, tüm birimleri tarafından benimsenmiş ve paydaşlarınca bilinen stratejik planı ve bu planıyla uyumlu uygulamaları vardır.
    4: Kurum uyguladığı stratejik planı izlemekte ve ilgili paydaşlarla birlikte değerlendirerek gelecek planlarına yansıtılmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Kamuoyuna ilan edilmiş, kurumun stratejik amaç ve hedeflerini içeren dokümanlar (stratejik plan, strateji belgesi vb.) ve dokümanın geliştirilme süreci
  - Kurumun stratejik planına planlama, uygulama, kontrol etme ve önlem alma aşamalarında iç ve dış paydaş katılımını gösteren kanıtlar
  - Stratejik plan ve hedeflerin, Birleşmiş Milletler Sürdürülebilir Kalkınma Amaçları’yla uyumunu gösteren kanıtlar
  - Stratejik Planda yer alan göstergelerin yıllık gerçekleşme takibini ve iyileştirme önerilerini içeren performans raporları
  - Stratejik amaçlar ve hedefler kapsamında paydaşlardan gelen talep, şikayet vb. kapsayacak şekilde uygulamaların sonuçlarını analiz eden iyileştirme raporları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.2.3
  title: Performans yönetimi
  parent: A.2
  description:
  - Birimde performans yönetim mekanizmaları bütünsel bir yaklaşımla ele alınmaktadır. Bu mekanizmalar kurumun stratejik amaçları doğrultusunda sürekli iyileşmesine ve geleceğe hazırlanmasına yardımcı olur.
  - Bilişim sistemleriyle desteklenerek performans yönetiminin doğru ve güvenilir olması sağlanmaktadır. Birim stratejik bakış açısını yansıtan performans yönetimi süreç odaklı ve paydaş katılımıyla sürdürülmektedir.
  - Tüm temel etkinlikleri kapsayan birimsel (genel, anahtar, uzaktan eğitim vb.) performans göstergeleri tanımlanmış ve paylaşılmıştır.
  - Performans göstergelerinin iç kalite güvencesi sistemi ile nasıl ilişkilendirildiği tanımlanmış ve yazılıdır. Kararlara yansıma örnekleri mevcuttur.
  - Yıllar içinde nasıl değiştiği takip edilmektedir, bu izlemenin sonuçları yazılıdır ve gerektiği şekilde kullanıldığına dair kanıtlar mevcuttur.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER
  rubric:
    1: Birimde performans yönetimi bulunmamaktadır
    2: Birimde performans göstergeleri ve performans yönetimi mekanizmaları tanımlanmıştır.
    3: Birimin geneline yayılmış performans yönetimi uygulamaları bulunmaktadır
    4: Birimde performans göstergelerinin işlerliği ve performans yönetimi mekanizmaları izlenmekte ve izlem sonuçlarına göre iyileştirmeler gerçekleştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Performans yönetim prosedürlerine dair belgeler
  - Performans göstergeleri ve anahtar performans göstergeleri
  - Performans yönetimi sürecinin nasıl işlediğini gösteren kanıtlar
  - Performans programı raporu
  - Performans yönetimi mekanizmalarının izlendiğine ve iyileştirildiğine dair kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.3.1
  title: Bilgi Yönetim Sistemi
  parent: A.3
  description:
  - Kurumun/Birimin önemli etkinlikleri ve süreçlerine ilişkin veriler toplanmakta, analiz edilmekte, raporlanmakta ve stratejik yönetim için kullanılmaktadır.
  - Akademik ve idari birimlerin kullandıkları Bilgi Yönetim Sistemi entegredir ve kalite yönetim süreçlerini beslemektedir.
  - Bilgi Yönetim Sistemi güvenliği, gizliliği ve güvenilirliği sağlanmıştır.
  units: BİLGİ İŞLEM D. B., VERİ VE DİJİTAL DÖNÜŞÜM KOORD.
  units_note:
  - 'Not: Bu başlık Üniversitemiz genelini kapsayacak şekilde raporlaştırılmalıdır.'
  rubric:
    1: Kurumda/Birimde bilgi yönetim sistemi bulunmamaktadır.
    2: Kurumda/Birimde kurumsal bilginin edinimi, saklanması, kullanılması, işlenmesi ve değerlendirilmesine destek olacak bilgi yönetim sistemleri oluşturulmuştur.
    3: Kurum /Birim genelinde temel süreçleri (eğitim ve öğretim, araştırma ve geliştirme, toplumsal katkı, kalite güvencesi) destekleyen entegre bilgi yönetim sistemi işletilmektedir.
    4: Kurumda/Birimde entegre bilgi yönetim sistemi izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Bilgi Yönetim Sistemi ve bu sistemin fonksiyonlarına ilişkin kanıtlar
  - Kişisel Verilerin İşlenmesine yönelik süreçler ve uygulamalar
  - Bilgi Yönetim Sistemi’nin izlenmesi ve iyileştirilmesine ilişkin kanıtlar
  - Bilgi güvenliğini ve güvenirliğini sağlamaya yönelik süreçler ve uygulamalar
  - Siber tehditlere yönelik risk, sızma testleri ve bağlı iyileştirmeler
  - Standart uygulamalar ve mevzuatın yanı sıra kurumun ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.3.2
  title: İnsan kaynakları yönetimi
  parent: A.3
  description:
  - İnsan kaynakları yönetimine ilişkin kurallar ve süreçler bulunmaktadır.
  - Şeffaf şekilde yürütülen bu süreçler Birimde/kurumda herkes tarafından bilinmektedir.
  - Eğitim ve liyakat öncelikli kriter olup, yetkinliklerin arttırılması temel hedeftir.
  - Çalışan (akademik-idari) memnuniyet, şikâyet ve önerilerini belirlemek ve izlemek amacıyla geliştirilmiş olan yöntem ve mekanizmalar uygulanmakta ve sonuçları değerlendirilerek iyileştirilmektedir.
  units: PERSONEL D. B., KURUMSAL GELİŞİM VE KALİTE OFİSİ KOORD.
  rubric:
    1: Birimde insan kaynakları yönetimine ilişkin tanımlı süreçler bulunmamaktadır.
    2: Birimde kurumun stratejik hedefleriyle uyumlu insan kaynakları yönetimine ilişkin tanımlı süreçler bulunmaktadır.
    3: Birimin genelinde insan kaynakları yönetimi doğrultusunda uygulamalar tanımlı süreçlere uygun bir biçimde yürütülmektedir.
    4: Birimde insan kaynakları yönetimi uygulamaları izlenmekte ve ilgili iç paydaşlarla değerlendirilerek iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - İnsan kaynakları politikası ve hedefleri ve bunlara ilişkin uygulamalar (Yetkinlik, işe alınma, hizmet içi eğitim, teşvik ve ödüllendirme vb.)
  - Çalışan (akademik ve idari) memnuniyeti anketleri, uygulama sistematiği ve anket sonuçları
  - İnsan kaynakları yönetimi uygulamalarına ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin/kurumun ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.3.3
  title: Finansal yönetim
  parent: A.3
  description:
  - Temel gelir ve gider kalemleri tanımlanmıştır ve yıllar içinde izlenmektedir.
  - 'Toplam Cari Bütçe (gelir) = Devlet eğitim katkısı (merkezi bütçeden gelen ve araştırma-geliştirme kategorisindeki faaliyetlere ait olmayan tüm gelirler) + öğrenci gelirleri (kaynağı öğrenci olan tüm gelirler: 1. ve 2. öğretim, tezsiz yüksek lisans, yaz okulu, hizmetler/harçlar, yemek-barınma ücreti vb.) + araştırma gelirleri (devletten merkezi bütçe içinde gelen + ulusal tahsis -yarışmasız projeler-) + ulusal yarışmacı araştırma destekleri + uluslararası araştırma destekleri [özel hesap, döner sermaye, vakıftan gelen veya başkaca muhasebeleştirilen] + toplumsal katkı gelirleri (tıp, dişçilik vb.) fakültelerin sağlık hizmeti geliri [döner sermaye veya başkaca muhasebeleştirilen] + mühendislik, mimarlık vb. fakültelerinin bilgi ve teknoloji transferi/projeler/uygulamalar geliri [döner sermaye veya başkaca muhasebeleştirilen] + erişkin eğitimi/yaşam boyu eğitim gelirleri + kira gelirleri + laboratuvar/deney/ölçüm vb. gelirler [özel hesap, döner sermaye, vakıftan gelen veya başkaca muhasebeleştirilen] + bağışlar (devlet dışı, şartlı veya şartsız olarak üniversiteye aktarılan kaynak) ayrıntısında izlenmektedir ve kurum profiliyle ilişkilendirilmektedir.'
  units: GENEL SEKRETERLİK, DAİRE BAŞKANLIKLARI, DÖNER SERMAYE İŞLETMESİ M., ENSTİTÜLER VE FAKÜLTELER, MYO
  rubric:
    1: Birimde finansal kaynakların yönetimine ilişkin tanımlı süreçler bulunmamaktadır.
    2: Birimde finansal kaynakların yönetimine ilişkin olarak stratejik hedefler ile uyumlu tanımlı süreçler bulunmaktadır.
    3: Birimin genelinde finansal kaynakların yönetime ilişkin uygulamalar tanımlı süreçlere uygun biçimde yürütülmektedir.
    4: Birimde finansal kaynakların yönetim süreçleri izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Finansal kaynakların yönetimine ilişkin tanımlı süreçler ve uygulamalar (Kaynak dağılımı, kaynakların etkin ve verimli kullanılması, kaynak çeşitliliği)
  - Finansal kaynakların planlama, kullanım ve izleme uygulamalarının kurumun stratejik planı ile uyumunu gösteren belgeler
  - Finansal kaynakların yönetimi süreçlerine ilişkin izleme raporları ve analizleri ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.3.4
  title: Süreç yönetimi
  parent: A.3
  description:
  - Tüm etkinliklere ait süreçler ve alt süreçler (uzaktan eğitim dahil) tanımlıdır.
  - Süreçlerdeki sorumlular, iş akışı, yönetim, sahiplenme yazılıdır ve birimce içselleştirilmiştir.
  - Süreç yönetiminin başarılı olduğunun kanıtları vardır.
  - Sürekli süreç iyileştirme döngüsü kurulmuştur.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimde eğitim ve öğretim, araştırma ve geliştirme, toplumsal katkı ve yönetim sistemine ilişkin süreçler tanımlanmamıştır.
    2: Birimde eğitim ve öğretim, araştırma ve geliştirme, toplumsal katkı ve yönetim sistemi süreç ve alt süreçleri tanımlanmıştır.
    3: Birimin genelinde tanımlı süreçler yönetilmektedir.
    4: Birimde süreç yönetimi mekanizmaları izlenmekte ve ilgili paydaşlarla değerlendirilerek iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Süreç yönetim modeli ve/veya Süreç Yönetimi El Kitabı
  - Süreç Kılavuzları ve Süreç Sorumluları Eğitim Belgeleri
  - Süreç yönetimi uygulamaları (Uzaktan eğitim dahil)
  - Paydaş katılımına ilişkin kanıtlar
  - Süreç yönetim mekanizmalarının izlenmesi ve iyileştirilmesine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.4.1
  title: İç ve dış paydaş katılımı
  parent: A.4
  description:
  - İç ve dış paydaşların karar alma, yönetişim ve iyileştirme süreçlerine katılım mekanizmaları tanımlanmıştır.
  - Gerçekleşen katılımın etkinliği, kurumsallığı ve sürekliliği irdelenmektedir.
  - Uygulama örnekleri, iç kalite güvencesi sisteminde özellikle öğrenci ve dış paydaş katılımı ve etkinliği mevcuttur.
  - Sonuçlar değerlendirilmekte ve bağlı iyileştirmeler gerçekleştirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimin iç kalite güvencesi sistemine paydaş katılımını sağlayacak mekanizmalar bulunmamaktadır.
    2: Birimde kalite güvencesi, eğitim ve öğretim, araştırma ve geliştirme, toplumsal katkı, yönetim sistemi ve uluslararasılaşma süreçlerinin PUKÖ katmanlarına paydaş katılımını sağlamak için planlamalar bulunmaktadır.
    3: Tüm süreçlerdeki PUKÖ katmanlarına paydaş katılımını sağlamak üzere Birimin geneline yayılmış mekanizmalar bulunmaktadır.
    4: Paydaş katılım mekanizmalarının işleyişi izlenmekte ve bağlı iyileştirmeler gerçekleştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Kurumun süreçlerine özgü oluşturulmuş iç ve dış paydaş listesi ile paydaşların önceliklendirilmesine ilişkin kanıtlar
  - Paydaş görüşlerinin alınması sürecinde kullanılan veri toplama araçları ve yöntemi (Anketler, odak grup toplantıları, çalıştaylar, bilgi yönetim sistemi vb.)
  - Karar alma süreçlerinde paydaş katılımının sağlandığını gösteren belgeler
  - Paydaş katılım mekanizmalarının işleyişine ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: A.4.2
  title: Öğrenci geri bildirimleri
  parent: A.4
  description:
  - Öğrenci görüşü (ders, dersin öğretim elemanı, diploma programı, hizmet ve genel memnuniyet seviyesi, vb.) sistematik olarak ve çeşitli yollarla alınmakta, etkin kullanılmakta ve sonuçları paylaşılmaktadır. Kullanılan yöntemlerin geçerli ve güvenilir olması, verilerin tutarlı ve temsil eder olması sağlanmıştır.
  - Öğrenci şikayetleri ve/veya önerileri için muhtelif kanallar vardır, öğrencilerce bilinir, bunların adil ve etkin çalıştığı denetlenmektedir.
  units: TÜM AKADEMİK BİRİMLER, TÜM İDARİ BİRİMLER VE ÜST YÖNETİM
  rubric:
    1: Birimde öğrenci geri bildirimlerinin alınmasına yönelik mekanizmalar bulunmamaktadır.
    2: Birimde öğretim süreçlerine ilişkin olarak öğrencilerin geri bildirimlerinin (ders, dersin öğretim elemanı, program, öğrenci iş yükü vb.) alınmasına ilişkin ilke ve kurallar oluşturulmuştur.
    3: Programların genelinde öğrenci geri bildirimleri (her yarıyıl ya da her akademik yıl sonunda) alınmaktadır.
    4: Tüm programlarda öğrenci geri bildirimlerinin alınmasına ilişkin uygulamalar izlenmekte ve öğrenci katılımına dayalı biçimde iyileştirilmektedir. Geri bildirim sonuçları karar alma süreçlerine yansıtılmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğrenci geri bildirimi elde etmeye ilişkin ilke ve kurallar
  - Tanımlı öğrenci geri bildirim mekanizmalarının tür, yöntem ve çeşitliliğini gösteren kanıtlar (Uzaktan/karma eğitim dahil)
  - Öğrenci geri bildirimleri kapsamında gerçekleştirilen iyileştirmelere ilişkin uygulamalar
  - Öğrencilerin karar alma mekanizmalarına katılımı örnekleri
  - Öğrenci geri bildirim mekanizmasının izlenmesi ve iyileştirilmesine yönelik kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
  - '* 2015 AKTS Kullanıcı Kılavuzu’ndaki anahtar prensipleri taşımalıdır.'
- id: A.4.3
  title: Mezun ilişkileri yönetimi
  parent: A.4
  description:
  - Mezunların işe yerleşme, eğitime devam, gelir düzeyi, işveren/ mezun memnuniyeti gibi istihdam bilgileri sistematik ve kapsamlı olarak toplanmakta, değerlendirilmekte, kurum gelişme stratejilerinde kullanılmaktadır.
  units: TÜM AKADEMİK BİRİMLER, KAGEM, ÖĞRENCİ İŞLERİ D. B., MEZUNLAR KOORD.
  rubric:
    1: Birimde mezun izleme sistemi bulunmamaktadır.
    2: Programların amaç ve hedeflerine ulaşılıp ulaşılmadığının irdelenmesi amacıyla bir mezun izleme sistemine ilişkin planlama bulunmaktadır.
    3: Birimdeki programların genelinde mezun izleme sistemi uygulamaları vardır.
    4: Mezun izleme sistemi uygulamaları izlenmekte ve ihtiyaçlar doğrultusunda programlarda güncellemeler yapılmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Mezun izleme sisteminin özellikleri
