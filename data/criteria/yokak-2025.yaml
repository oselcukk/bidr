- id: B.1.1
  title: Programların tasarımı ve onayı
  parent: B.1
  description:
  - Programların amaçları ve öğrenme çıktıları (kazanımları) oluşturulmuş, TYÇ ile uyumu belirtilmiş, kamuoyuna ilan edilmiştir.
  - Program yeterlilikleri belirlenirken kurumun/birimin misyon-vizyonu göz önünde bulundurulmuştur.
  - Ders bilgi paketleri varsa ulusal çekirdek programı, varsa ölçütler (örneğin akreditasyon ölçütleri vb.) dikkate alınarak hazırlanmıştır.
  - Kazanımların ifade şekli öngörülen bilişsel, duyuşsal ve devinimsel seviyeyi açıkça belirtmektedir.
  - Program çıktılarının gerçekleştiğinin nasıl izleneceğine dair planlama yapılmıştır, özellikle kurumun ortak (generic) çıktıların irdelenme yöntem ve süreci ayrıntılı belirtilmektedir.
  - Öğrenme çıktılarının ve gerekli öğretim süreçlerinin yapılandırılmasında bölüm bazında ilke ve kurallar bulunmaktadır.
  - Program düzeyinde yeterliliklerin hangi eylemlerle kazandırılabileceği (yeterlilik-ders-öğretim yöntemi matrisleri) belirlenmiştir.
  - Alan farklılıklarına göre yeterliliklerin hangi eğitim türlerinde (örgün, karma, uzaktan) kazandırılabileceği tanımlıdır.
  - Programların tasarımında, fiziksel ve teknolojik olanaklar dikkate alınmaktadır (erişim, sosyal mesafe vb.).
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Birimde programların tasarımı ve onayına ilişkin süreçler tanımlanmamıştır.
    2: Birimde programların tasarımı ve onayına ilişkin ilke, yöntem, TYÇ ile uyum ve paydaş katılımını içeren tanımlı süreçler bulunmaktadır.
    3: Tanımlı süreçler doğrultusunda; Birimin genelinde, tasarımı ve onayı gerçekleşen programlar, programların amaç ve öğrenme çıktılarına uygun olarak yürütülmektedir.
    4: Programların tasarım ve onay süreçleri sistematik olarak izlenmekte ve ilgili paydaşlarla birlikte değerlendirilerek iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Program tasarımı ve onayı için kullanılan tanımlı süreçler (Eğitim politikasıyla uyumu, el kitabı, kılavuz, usul ve esas vb.)
  - Program tasarımı ve onayı süreçlerinin yönetsel ve organizasyonel yapısı (Komisyonlar, süreç sorumluları, süreç akışı vb.)
  - Program amaç ve çıktılarının TYÇ ile uyumunu gösteren kanıtlar (ders program örnekleri, güncel ders izlence örnekleri vb.)
  - Uzaktan-karma program tasarımında bölüm/alan bazlı uygulama çeşitliliğine ilişkin kanıtlar (bölümlerin farklı uzaktan eğitim taleplerinin dikkate alındığına ilişkin kanıtlar vb.)
  - Program tasarım süreçlerine paydaş katılımını gösteren kanıtlar
  - Programların tasarım ve onay sürecinin izlendiği ve buna göre yapılan iyileştirilmelere ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.1.2
  title: Programın ders dağılım dengesi
  parent: B.1
  description:
  - Programın ders dağılımına ilişkin ilke, kural ve yöntemler tanımlıdır.
  - Ders dağılımında öğretim elemanlarının uzmanlık alanları ve iş yükleri gözetilir ve ders dağılımı katılımcı bir şekilde belirlenir.
  - Öğretim programı (müfredat) yapısı zorunlu-seçmeli ders, alan-alan dışı ders dengesini gözetmekte, kültürel derinlik ve farklı disiplinleri tanıma imkânı vermektedir.
  - Ders sayısı ve haftalık ders saati öğrencinin akademik olmayan etkinliklere de zaman ayırabileceği şekilde düzenlenmiştir.
  - Bu kapsamda geliştirilen ders bilgi paketlerinin amaca uygunluğu ve işlerliği izlenmekte ve bağlı iyileştirmeler yapılmaktadır.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Ders dağılımına ilişkin, ilke ve yöntemler tanımlanmamıştır.
    2: Ders dağılımına ilişkin olarak; öğretim elemanlarının uzmanlık alanına, alan/meslek bilgisi/genel kültür, zorunlu- seçmeli ders dengesine, kültürel derinlik kazanma, farklı disiplinleri tanıma imkânları gibi boyutlara yönelik ilke ve yöntemleri içeren tanımlı süreçler bulunmaktadır.
    3: Ders dağılımı dengesine ilişkin tanımlı süreçlere uygun olarak Birim genelinde uygulamalar bulunmaktadır.
    4: Programlarda ders dağılım dengesi izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Ders dağılımına ilişkin ilke ve yöntemler ile buna ilişkin kanıtlar
  - İlan edilmiş ders bilgi paketlerinde ders dağılım dengesinin gözetildiğine ilişkin kanıtlar
  - Eğitim komisyonu kararı, senato kararları vb.
  - Ders dağılım dengesinin izlenmesine ve iyileştirilmesine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.1.3
  title: Ders kazanımlarının program çıktılarıyla uyumu
  parent: B.1
  description:
  - Derslerin öğrenme kazanımları (karma ve uzaktan eğitim de dahil) tanımlanmış ve program çıktıları ile ders kazanımları eşleştirmesi oluşturulmuş ve ilan edilmiştir.
  - Kazanımların ifade şekli öngörülen bilişsel, duyuşsal ve devinimsel seviyeyi açıkça belirtmektedir.
  - Ders öğrenme kazanımlarının gerçekleştiğinin nasıl izleneceğine dair planlama yapılmıştır, özellikle alana özgü olmayan (genel) kazanımların irdelenme yöntem ve süreci ayrıntılı belirtilmektedir.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Ders kazanımları program çıktıları ile eşleştirilmemiştir.
    2: Ders kazanımlarının oluşturulması ve program çıktılarıyla uyumlu hale getirilmesine ilişkin ilke, yöntem ve sınıflamaları içeren tanımlı süreçler bulunmaktadır.
    3: Ders kazanımları programların genelinde program çıktılarıyla uyumlandırılmıştır ve ders bilgi paketleri ile paylaşılmaktadır.
    4: Ders kazanımlarının program çıktılarıyla uyumu izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Birimde, ders kazanımlarını değerlendirilmesi ve müfredat öğrenim hedeflerine ulaşılması ve bunların program çıktıları ile uyumunun nasıl ölçtüğüne dair etkili süreçleri nasıl gerçekleşeceğini gösteren yönerge ve planlama kanıtları
  - Program çıktıları ve ders kazanımlarının ilişkilendirilmesi
  - Program dışından alınan derslerin (örgün veya uzaktan) program çıktılarıyla uyumunu gösteren kanıtlar
  - Ders kazanımların program çıktılarıyla uyumunun izlenmesine ve iyileştirilmesine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra; birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.1.4
  title: Öğrenci iş yüküne dayalı ders tasarımı
  parent: B.1
  description:
  - Tüm derslerin AKTS değeri web sayfası üzerinden paylaşılmakta, öğrenci iş yükü takibi ile doğrulanmaktadır.
  - Staj ve mesleğe ait uygulamalı öğrenme fırsatları mevcuttur ve yeterince öğrenci iş yükü ve kredi çerçevesinde değerlendirilmektedir. Gerçekleşen uygulamanın niteliği irdelenmektedir.
  - Öğrenci iş yüküne dayalı tasarımda uzaktan eğitimle ortaya çıkan çeşitlilikler de göz önünde bulundurulmaktadır.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Dersler öğrenci iş yüküne dayalı olarak tasarlanmamıştır.
    2: Öğrenci iş yükünün nasıl hesaplanacağına ilişkin staj, mesleki uygulama hareketlilik gibi boyutları içeren ilke ve yöntemlerin yer aldığı tanımlı süreçler* bulunmaktadır.
    3: Dersler öğrenci iş yüküne uygun olarak tasarlanmış, ilan edilmiş ve uygulamaya konulmuştur.
    4: Programlarda öğrenci iş yükü izlenmekte ve buna göre ders tasarımı güncellenmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - AKTS ders bilgi paketleri* (Uzaktan ve karma eğitim programları dahil)
  - Öğrenci iş yükü kredisinin mesleki uygulamalar, değişim programları, staj ve projeler için tanımlandığını gösteren kanıtlar*
  - İş yükü temelli kredilerin transferi ve tanınmasına ilişkin tanımlı süreçleri içeren belgeler
  - Programlarda öğrenci İş yükünün belirlenmesinde öğrenci katılımının sağlandığına ilişkin belgeler ve mekanizmalar
  - Diploma Eki
  - Derslerin AKTS kredileri ve AKTS hesaplama tablolarının takibini gösteren kanıtlar
  - AKTS hesaplama tabloları ve ek belgeler (örn; öğretim üyeleri ve öğrencilerle yapılan anketler)
  - İş yükü temelli kredilerin geribildirimler doğrultusunda güncellendiğine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
  - '* 2015 AKTS Kullanıcı Kılavuzu’ndaki anahtar prensipleri taşımalıdır.'
- id: B.1.5
  title: Programların izlenmesi ve güncellenmesi
  parent: B.1
  description:
  - Her program ve ders için (örgün, uzaktan, karma, açıktan) program amaçlarının ve öğrenme çıktılarının izlenmesi planlandığı şekilde gerçekleşmektedir. Bu sürecin isleyişi ve sonuçları paydaşlarla birlikte değerlendirilmektedir.
  - Eğitim ve öğretim ile ilgili istatistiki göstergeler (her yarıyıl açılan dersler, öğrenci sayıları, başarı durumları, geri besleme sonuçları, ders çeşitliliği, lab uygulama, lisans/lisansüstü dengeleri, ilişki kesme sayıları/nedenleri, vb.) periyodik ve sistematik şekilde izlenmekte, tartışılmakta, değerlendirilmekte, karşılaştırılmakta ve kaliteli eğitim yönündeki gelişim sürdürülmektedir.
  - Program akreditasyonu planlaması, teşviki ve uygulaması vardır; kurumun akreditasyon stratejisi belirtilmiş ve sonuçları tartışılmıştır. Akreditasyonun getirileri, iç kalite güvence sistemine katkısı değerlendirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Program çıktılarının izlenmesine ve güncellenmesine ilişkin mekanizma bulunmamaktadır.
    2: Program çıktılarının izlenmesine ve güncellenmesine ilişkin periyot, ilke, kural ve göstergeler oluşturulmuştur.
    3: Programların genelinde program çıktılarının izlenmesine ve güncellenmesine ilişkin mekanizmalar işletilmektedir.
    4: Program çıktıları bu mekanizmalar ile izlenmekte ve ilgili paydaşların görüşleri de alınarak güncellenmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Programların izlenmesi ve güncellenmesine ilişkin periyot (yıllık ve program süresinin sonunda) ilke, kural, gösterge, plan ve uygulamalar
  - Birimin, kurumun misyon, vizyon ve hedefleri doğrultusunda programlarını güncellemek üzere kurduğu mekanizma örnekleri
  - Programların yıllık öz değerlendirme raporları (Program çıktıları açısından değerlendirme)
  - Program çıktılarına ulaşılıp ulaşılmadığını izleyen sistemler (Bilgi Yönetim Sistemi)
  - Programların yıllık ve program süresi temelli izlemelerden hareketle yapılan iyileştirmeler
  - Yapılan iyileştirmeler ve değişiklikler konusunda paydaşların bilgilendirildiği uygulamalar
  - Programın amaçlarına ulaşıp ulaşmadığına ilişkin geri bildirimler
  - Doğal afet vb. gibi olağan dışı durumlar karşısında programların yürütülmesi için gerekli sürdürülebilir öğretim modelinin oluşturulduğuna dair kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.1.6
  title: Eğitim ve öğretim süreçlerinin yönetimi
  parent: B.1
  description:
  - Birim, eğitim ve öğretim süreçlerini bütüncül olarak yönetmek üzere; organizasyonel yapılanma (üniversite eğitim ve öğretim komisyonu, öğrenme ve öğretme merkezi, vb.), bilgi yönetim sistemi ve uzman insan kaynağına sahiptir.
  - Eğitim ve öğretim süreçleri üst yönetimin koordinasyonunda yürütülmekte olup; bu süreçlere ilişkin görev ve sorumluluklar tanımlanmıştır.
  - Eğitim ve öğretim programlarının tasarlanması, yürütülmesi, değerlendirilmesi ve güncellenmesi faaliyetlerine ilişkin birim genelinde ilke, esaslar ile takvim belirlidir.
  - Programlarda öğrenme kazanımı, öğretim programı (müfredat), eğitim hizmetinin verilme biçimi (örgün, uzaktan, karma, açıktan), öğretim yöntemi ve ölçme-değerlendirme uyumu ve tüm bu süreçlerin koordinasyonu üst yönetim tarafından takip edilmektedir.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B., BİLGİ İŞLEM D. B., PERSONEL D. B., ÜST YÖNETİM
  rubric:
    1: Birimde eğitim ve öğretim süreçlerini bütüncül olarak yönetmek üzere bir sistem bulunmamaktadır.
    2: Birimde eğitim ve öğretim süreçlerini  bütüncül olarak yönetmek üzere sistem, ilke ve kurallar bulunmaktadır.
    3: Birimin genelinde eğitim ve öğretim süreçleri belirlenmiş ilke ve kuralara uygun yönetilmektedir.
    4: Birimde eğitim ve öğretim yönetim sistemine ilişkin uygulamalar izlenmekte ve izlem sonuçlarına göre iyileştirme yapılmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Eğitim ve öğretim süreçlerinin yönetimine ilişkin organizasyonel yapılanma ve iş akış şemaları
  - Eğitim ve öğretim ile ölçme ve değerlendirme süreçlerinin yönetimine ilişkin ilke, kurallar ve takvim
  - Bilgi Yönetim Sistemi
  - Eğitim ve öğretim süreçlerinin yönetimine ilişkin izleme ve iyileştirme kanıtları
  - İzleme çalışmalarına dair değerlendirme raporları, geri bildirimlerin analiz edildiği raporlar ya da analiz içeren dokümanlar ve bu dokümanlara dayanarak yapılan iyileştirmelere ilişkin yapılan düzenlemeler
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.2.1
  title: Öğretim yöntem ve teknikleri
  parent: B.2
  description:
  - Öğretim yöntemi öğrenciyi aktif hale getiren ve etkileşimli öğrenme odaklıdır.
  - Tüm eğitim türleri içerisinde (örgün, uzaktan, karma) o eğitim türünün doğasına uygun; öğrenci merkezli, yetkinlik temelli, süreç ve performans odaklı disiplinlerarası, bütünleyici, vaka/uygulama temelinde öğrenmeyi önceleyen yaklaşımlara yer verilir.
  - Bilgi aktarımından çok derin öğrenmeye, öğrenci ilgi, motivasyon ve bağlılığına odaklanılmıştır.
  - Örgün eğitim süreçleri ön lisans, lisans ve lisansüstü öğrencilerini kapsayan; teknolojinin sunduğu olanaklar ve ters yüz öğrenme, proje temelli öğrenme gibi yaklaşımlarla zenginleştirilmektedir.
  - Öğrencilerinin araştırma süreçlerine katılımı müfredat, yöntem ve yaklaşımlarla desteklenmektedir.
  - Tüm bu süreçlerin uygulanması, kontrol edilmesi ve gereken önlemlerin alınması sistematik olarak değerlendirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, PERSONEL D. B., ÜST YÖNETİM
  rubric:
    1: Öğrenme-öğretme süreçlerinde öğrenci merkezli yaklaşımlar bulunmamaktadır.
    2: Öğrenme-öğretme süreçlerinde öğrenci merkezli yaklaşımın uygulanmasına yönelik ilke, kural ve planlamalar bulunmaktadır.
    3: Programların genelinde öğrenci merkezli öğretim yöntem teknikleri tanımlı süreçler doğrultusunda uygulanmaktadır.
    4: Öğrenci merkezli uygulamalar izlenmekte ve ilgili iç paydaşların katılımıyla iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Ders bilgi paketlerinde öğrenci merkezli öğretim yöntemlerinin varlığı
  - Uzaktan eğitime özgü öğretim materyali geliştirme ve öğretim yöntemlerine ilişkin ilkeler, mekanizmalar
  - Aktif ve etkileşimli öğretme yöntemlerine ilişkin tanımlı süreçler ve uygulamalar
  - Eğiticilerin eğitimi program içeriğinde öğrenci merkezli öğrenme-öğretme yaklaşımına ilişkin uygulamalar
  - Süreçlerin izlenmesine ve buna bağlı iyileştirme çalışmalarına yönelik kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.2.2
  title: Ölçme ve değerlendirme
  parent: B.2
  description:
  - Öğrenci merkezli ölçme ve değerlendirme, yetkinlik ve performans temelinde yürütülmekte ve öğrencilerin kendini ifade etme olanakları mümkün olduğunca çeşitlendirilmektedir.
  - Ölçme ve değerlendirmenin sürekliliği çoklu sınav olanakları ve bazıları süreç odaklı (formatif) ödev, proje, portfolyo gibi yöntemlerle sağlanmaktadır.
  - Ders kazanımlarına ve eğitim türlerine (örgün, uzaktan, karma) uygun sınav yöntemleri planlamakta ve uygulanmaktadır.
  - Sınav uygulama ve güvenliği (örgün/çevrimiçi sınavlar, dezavantajlı gruplara yönelik sınavlar) mekanizmaları bulunmaktadır.
  - Ölçme ve değerlendirme uygulamalarının zaman ve kişiler arasında tutarlılığı ve güvenirliği sağlanmaktadır.
  - Birim, ölçme-değerlendirme yaklaşım ve olanaklarını öğrenci-öğretim elemanı geri bildirimine dayalı biçimde iyileştirmektedir.
  - Bu iyileştirmelerin duyurulması, uygulanması, kontrolü, hedeflerle uyumu ve alınan önlemler irdelenmektedir.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B.
  rubric:
    1: Programlarda öğrenci merkezli ölçme ve değerlendirme yaklaşımları bulunmamaktadır.
    2: Öğrenci merkezli ölçme ve değerlendirmeye ilişkin ilke, kural ve planlamalar bulunmaktadır.
    3: Programların genelinde öğrenci merkezli ve çeşitlendirilmiş ölçme ve değerlendirme uygulamaları bulunmaktadır.
    4: Öğrenci merkezli ölçme ve değerlendirme uygulamaları izlenmekte ve ilgili iç paydaşların katılımıyla iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğrenci merkezli ölçme ve değerlendirme yaklaşımlarını içeren planlama dokümanları, organizasyon yapıları ve görev tanımları
  - Programlardaki ölçme ve değerlendirme çeşitliliğine ilişkin uygulama örnekleri
  - Örgün/uzaktan/karma derslerde kullanılan sınav örnekleri (programda yer verilen farklı ölçme araçlarına ilişkin)
  - Ölçme ve değerlendirme uygulamalarının ders kazanımları ve program yeterlilikleriyle ilişkilendirildiğini, öğrenci iş yükünü temel aldığını* gösteren ders bilgi paketi örnekleri
  - Dezavantajlı gruplar ve çevrimiçi sınavlar gibi özel ölçme türlerine ilişkin mekanizmalar
  - Sınav güvenliği mekanizmaları
  - İzleme ve paydaş katılımına dayalı iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
  - '* 2015 AKTS Kullanıcı Kılavuzu’ndaki anahtar prensipleri taşımalıdır.'
- id: B.2.3
  title: Öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesi*
  parent: B.2
  description:
  - Öğrenci kabulüne (merkezi yerleştirmeyle gelen öğrenci grupları dışında kalan öğrenciler dahil) ilişkin ilke ve kuralları tanımlanmış ve ilan edilmiştir.
  - Bu ilke ve kurallar birbiri ile tutarlı olup, uygulamalar şeffaftır.
  - Diploma, sertifika gibi belge talepleri titizlikle takip edilmektedir.
  - Önceki öğrenmenin (örgün, yaygın, uzaktan/karma eğitim ve serbest öğrenme yoluyla edinilen bilgi ve becerilerin) tanınması ve kredilendirilmesi yapılmaktadır.
  - Uluslararasılaşma politikasına paralel hareketlilik destekleri, öğrenciyi teşvik, kolaylaştırıcı önlemler bulunmaktadır ve hareketlilikte kredi kaybı olmaması yönünde uygulamalar vardır.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B., ULUSLARARASI İLİŞKİLER KOORD.
  rubric:
    1: Birimde öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin süreçler tanımlanmamıştır.
    2: Birimde öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin ilke, kural ve bağlı planlar bulunmaktadır.
    3: Birimin genelinde  öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin  planlar dahilinde uygulamalar bulunmaktadır.
    4: Öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin süreçler izlenmekte, iyileştirilmekte ve güncellemeler ilan edilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin ilke ve kurallar
  - Önceki öğrenmelerin tanınmasında öğrenci iş yükü temelli kredilerin kullanıldığına dair belgeler
  - Uygulamaların tanımlı süreçlerle uyumuna ve sürekliliğine ilişkin kanıtlar
  - Paydaşların bilgilendirildiği mekanizmalar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
  - '* 2015 AKTS Kullanıcı Kılavuzu’ndaki anahtar prensipleri taşımalıdır.'
- id: B.2.4
  title: Yeterliliklerin sertifikalandırılması ve diploma
  parent: B.2
  description:
  - Yeterliliklerin onayı, mezuniyet koşulları, mezuniyet karar süreçleri açık, anlaşılır, kapsamlı ve tutarlı şekilde tanımlanmış ve kamuoyu ile paylaşılmıştır.
  - Sertifikalandırma ve diploma işlemleri bu tanımlı sürece uygun olarak yürütülmekte, izlenmekte ve gerekli önlemler alınmaktadır.
  units: TÜM AKADEMİK BİRİMLER, ÖĞRENCİ İŞLERİ D. B., ULUSLARARASI İLİŞKİLER KOORD., ÜST YÖNETİM
  rubric:
    1: Birimde diploma onayı ve diğer yeterliliklerin sertifikalandırılmasına ilişkin süreçler tanımlanmamıştır.
    2: Birimde diploma onayı ve diğer yeterliliklerin sertifikalandırılmasına ilişkin kapsamlı, tutarlı ve ilan edilmiş ilke, kural ve süreçler bulunmaktadır.
    3: Birimin genelinde diploma onayı ve diğer yeterliliklerin sertifikalandırılmasına ilişkin uygulamalar bulunmaktadır.
    4: Uygulamalar izlenmekte ve tanımlı süreçler iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğrencinin akademik ve kariyer gelişimini izlemek, diploma onayı ve yeterliliklerin sertifikalandırılmasına ilişkin tanımlı süreçler ve mevcut uygulamalar
  - Merkezi yerleştirmeyle gelen öğrenci grupları dışında kalan yatay geçiş, yabancı uyruklu öğrenci sınavı (YÖS), çift anadal programı (ÇAP), yandal öğrenci kabullerinde uygulanan kriterler
  - Öğrenci iş yükü kredisinin değişim programlarında herhangi bir ek çalışmaya gerek kalmaksızın tanındığını gösteren belgeler*
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
  - '* 2015 AKTS Kullanıcı Kılavuzu’ndaki anahtar prensipleri taşımalıdır.'
- id: B.3.1
  title: Öğrenme ortam ve kaynakları
  parent: B.3
  description:
  - Sınıf, laboratuvar, kütüphane, stüdyo; ders kitapları, çevrimiçi (online) kitaplar/belgeler/videolar vb. kaynaklar uygun nitelik ve niceliktedir, erişilebilirdir ve öğrencilerin bilgisine/kullanımına sunulmuştur.
  - Öğrenme ortamı ve kaynaklarının kullanımı izlenmekte ve iyileştirilmektedir.
  - Birimde/Kurumda eğitim-öğretim ihtiyaçlarına tümüyle cevap verebilen, kullanıcı dostu, ergonomik, eş zamanlı ve eş zamansız öğrenme, zenginleştirilmiş içerik geliştirme ayrıca ölçme ve değerlendirme ve hizmetiçi eğitim olanaklarına sahip bir öğrenme yönetim sistemi bulunmaktadır.
  - Öğrenme ortamı ve kaynakları öğrenci-öğrenci, öğrenci-öğretim elemanı ve öğrenci-materyal etkileşimini geliştirmeye yönelmektedir.
  units: TÜM AKADEMİK BİRİMLER, YAPI İŞLERİ D. B., BİLGİ İŞLEM D. B., KÜTÜPHANE D. B., ÜST YÖNETİM
  units_note:
  - 'Not: Bu başlık Üniversitemiz genelini kapsayacak şekilde raporlaştırılmalıdır'
  rubric:
    1: Birimin/Kurumun eğitim-öğretim faaliyetlerini sürdürebilmek için yeterli kaynağı bulunmamaktadır.
    2: Birimin/Kurumun eğitim-öğretim faaliyetlerini sürdürebilmek için uygun nitelik ve nicelikte öğrenme kaynaklarının (sınıf, laboratuvar, stüdyo, öğrenme yönetim sistemi, basılı/e-kaynak ve materyal, insan kaynakları vb.) oluşturulmasına yönelik planları vardır.
    3: Birimin/Kurumun genelinde öğrenme kaynaklarının yönetimi alana özgü koşullar, erişilebilirlik ve birimler arası denge gözetilerek gerçekleştirilmektedir.
    4: Öğrenme kaynaklarının geliştirilmesine ve kullanımına yönelik izleme ve iyileştirilme yapılmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğrenme kaynakları ve bu kaynakların yeterlilik durumu, geliştirilmesine ilişkin planlamalar ve uygulamalar
  - Öğrenci el kitabı (kurumun sunduğu öğrenme ortan ve kaynaklarını anlatan)
  - Öğrencilerin (kütüphane, laboratuvar vb.) erişim analizleri
  - Öğrenme kaynaklarına erişilebilirlik kanıtları (Uzaktan eğitim dahil)
  - Öğrenme yönetim sistemi uygulamalarına ilişkin örnekler
  - Öğrencilere sunulan öğrenme kaynakları ile ilgili öğrenci geri bildirim araçları (Anketler vb.)
  - Öğrenme kaynaklarının düzenli izlendiğine ve iyileştirildiğine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin/kurumun ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.3.2
  title: Akademik destek hizmetleri
  parent: B.3
  description:
  - Öğrencinin akademik gelişimini takip eden, yön gösteren, akademik sorunlarına ve kariyer planlamasına destek olan bir danışman öğretim üyesi bulunmaktadır.
  - Danışmanlık sistemi öğrenci portfolyosu gibi yöntemlerle takip edilmekte ve iyileştirilmektedir.
  - Öğrencilerin danışmanlarına erişimi kolaydır ve çeşitli erişimi olanakları (yüz yüze, çevrimiçi) bulunmaktadır.
  - Psikolojik danışmanlık ve kariyer merkezi hizmetleri vardır, erişilebilirdir (yüz yüze ve çevrimiçi) ve öğrencilerin bilgisine sunulmuştur.
  - Hizmetlerin yeterliliği takip edilmektedir.
  units: TÜM AKADEMİK BİRİMLER, KAGEM, SKS D.B.
  rubric:
    1: Birimde öğrencilerin akademik gelişimi ve kariyer planlamasına yönelik destek hizmetleri bulunmamaktadır.
    2: Birimde öğrencilerin akademik gelişimi ve kariyer planlaması süreçlerine ilişkin tanımlı ilke ve kurallar bulunmaktadır.
    3: Birimde öğrencilerin akademik gelişim ve kariyer planlamasına yönelik destek hizmetleri tanımlı ilke ve kurallar dahilinde yürütülmektedir.
    4: Birimde öğrencilerin akademik gelişimi ve kariyer planlamasına ilişkin uygulamalar izlenmekte ve öğrencilerin katılımıyla iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Akademik destek hizmetleri için kullanılan tanımlı süreçler
  - Varsa uzaktan eğitimde akademik ve teknik öğrenci danışmanlığı mekanizmaları ve tanımlı süreçler
  - Öğrencilerin danışmanlara erişimine ilişkin mekanizmalar
  - Psikolojik danışmanlık veya kariyer merkezi organizasyonel yapılanması
  - Rehberlik, psikolojik danışmanlık ve kariyer hizmetlerine ilişkin planlama ve uygulamalar
  - Kariyer merkezi uygulamaları
  - Öğrencilerin katılımına ilişkin kanıtlar
  - Öğrencilere sunulan hizmetlerle ilgili öğrenci geri bildirim araçlarının sonuçları ve izleme kanıtları
  - Sürece ilişkin yapılan güncelleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.3.3
  title: Tesis ve altyapılar
  parent: B.3
  description:
  - Tesis ve altyapılar (yemekhane, yurt, teknoloji donanımlı çalışma alanları; sağlık, ulaşım, bilişim hizmetleri, uzaktan eğitim altyapısı) ihtiyaca uygun nitelik ve niceliktedir, erişilebilirdir ve öğrencilerin bilgisine/kullanımına sunulmuştur.
  - Tesis ve altyapıların kullanımı irdelenmektedir.
  units: TÜM AKADEMİK BİRİMLER, YAPI İŞLERİ D. B., BİLGİ İŞLEM D. B., SKS D. B., GENEL SEKRETERLİK, ÜST YÖNETİM
  units_note:
  - 'Not: Bu başlık Üniversitemiz genelini kapsayacak şekilde raporlaştırılmalıdır'
  rubric:
    1: Birimde/Kurumda uygun nitelik ve nicelikte tesisler ve altyapı bulunmamaktadır.
    2: Birimde/Kurumda uygun nitelik ve nicelikte tesis ve altyapının (yemekhane, yurt, sağlık, kütüphane, ulaşım, bilgi ve iletişim altyapısı, uzaktan eğitim altyapısı vb.) kurulmasına ve kullanımına ilişkin planlamalar bulunmaktadır.
    3: Birimin/Kurumun genelinde tesis ve altyapı erişilebilirdir ve bunlardan fırsat eşitliğine dayalı olarak yararlanılmaktadır
    4: Tesis ve altyapının kullanımı izlenmekte ve ihtiyaçlar doğrultusunda iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Tesis ve altyapının kullanımına yönelik ilke ve kurallar
  - Erişim ve kullanıma ilişkin uygulamalar
  - Tesis ve altyapının kurumsal büyüme ile ilişkili olarak gelişim durumu (Örneğin, birim sayısındaki artış ile fiziksel alanlardaki artış arasındaki ilişki gibi)
  - Birimde/Kurumda uzaktan eğitim programları ve uygulamaları varsa; bunlara yönelik alt yapı, tesis, donanım ve yazılım durumları
  - Tesis ve altyapı hizmetlerinin izlenmesi, çeşitlendirilmesi ve iyileştirilmesine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin/kurumun ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.3.4
  title: Dezavantajlı gruplar
  parent: B.3
  description:
  - Dezavantajlı, kırılgan ve az temsil edilen grupların (engelli, yoksul, azınlık, göçmen vb.) eğitim olanaklarına erişimi eşitlik, hakkaniyet, çeşitlilik ve kapsayıcılık gözetilerek sağlanmaktadır.
  - Uzaktan eğitim alt yapısı bu grupların ihtiyacı dikkate alınarak oluşturulmuştur.
  - Üniversite yerleşkelerinde ihtiyaçlar doğrultusunda engelsiz üniversite uygulamaları bulunmaktadır.
  - Bu grupların eğitim olanaklarına erişimi izlenmekte ve geri bildirimleri doğrultusunda iyileştirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, ENGELSİZ [KURUM] BİRİMİ, TOPLUMSAL KATKI KOORD., YAPI İŞLERİ D. B, SKS D. B.
  rubric:
    1: Birimde dezavantajlı grupların eğitim olanaklarına erişimine ilişkin planlamalar bulunmamaktadır.
    2: Dezavantajlı grupların eğitim olanaklarına nitelikli ve adil  erişimine ilişkin planlamalar bulunmaktadır.
    3: Dezavantajlı grupların eğitim olanaklarına erişimine ilişkin uygulamalar yürütülmektedir.
    4: Dezavantajlı grupların eğitim olanaklarına erişimine yönelik uygulamalar izlenmekte ve dezavantajlı grupların görüşleri de alınarak iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Dezavantajlı öğrenci gruplarına sunulacak hizmetlerle ilgili planlama ve uygulamalar (Kurullarda temsil, engelsiz üniversite uygulamaları, varsa uzaktan eğitim süreçlerindeki uygulamalar vb.)
  - Dezavantajlı gruplardan alınan geri bildirimlerin izleme ve iyileştirme mekanizmalarında kullanıldığına ilişkin belgeler
  - Engelsiz üniversite uygulamalarına ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.3.5
  title: Sosyal, kültürel, sportif faaliyetler
  parent: B.3
  description:
  - Öğrenci toplulukları ve bu toplulukların etkinlikleri, sosyal, kültürel ve sportif faaliyetlerine yönelik mekân, bütçe ve rehberlik desteği vardır.
  - Ayrıca sosyal, kültürel, sportif faaliyetleri yürüten ve yöneten idari örgütlenme mevcuttur.
  - Gerçekleştirilen faaliyetler izlenmekte, ihtiyaçlar doğrultusunda iyileştirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, TOPLUMSAL KATKI KOORD., ENGELSİZ [KURUM] BİRİMİ, SKS D. B., ÖĞRENCİ TOPLULUKLARI KOORD., KAGEM, BEDEN EĞİTİMİ VE SPOR BÖLÜMÜ
  rubric:
    1: Birimde uygun nitelik ve nicelikte sosyal, kültürel ve sportif faaliyet olanakları bulunmamaktadır.
    2: Sosyal, kültürel ve sportif faaliyet olanaklarının yaratılmasına ilişkin planlamalar bulunmaktadır.
    3: Birimin genelinde sosyal, kültürel ve sportif faaliyetler erişilebilirdir ve bunlardan fırsat eşitliğine dayalı olarak yararlanılmaktadır.
    4: Sosyal, kültürel ve sportif faaliyet mekanizmaları izlenmekte, ihtiyaçlar/talepler doğrultusunda faaliyetler çeşitlendirilmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Sosyal, kültürel ve sportif faaliyetlerin planlanması ve yürütülmesine ilişkin kanıtlar
  - Yıl içerisinde öğrencilere yönelik yıllık sportif, kültürel, sosyal faaliyetlerin listesi (Faaliyet türü, konusu, katılımcı sayısı vb. bilgilerle)
  - Faaliyetlerin erişilebilirliği ve fırsat eşitliğini gözettiğine dair kanıt örnekleri
  - Faaliyetlerin çeşitliliği ve paydaş geribildirimlerinin göze alındığını gösteren kanıtlar
  - Sosyal, kültürel ve sportif faaliyetlerin izlenmesine ilişkin araçlar, izleme raporları, iyileştirme ve çeşitlendirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.4.1
  title: Atama, yükseltme ve görevlendirme kriterleri
  parent: B.4
  description:
  - Öğretim elemanı (uluslararası öğretim elemanları dahil) atama, yükseltme ve görevlendirme süreç ve kriterleri belirlenmiş ve kamuoyuna açıktır.
  - İlgili süreç ve kriterler akademik liyakati gözetip, fırsat eşitliğini sağlayacak niteliktedir.
  - Uygulamanın kriterlere uygun olduğu kanıtlanmaktadır.
  - Öğretim elemanı ders yükü ve dağılım dengesi şeffaf olarak paylaşılır.
  - Birimin öğretim üyesinden beklentisi bireylerce bilinir.
  - Kurum dışından ders vermek üzere görevlendirilenlerin seçiminde liyakate dikkat edilir ve yarıyıl sonunda performanslarının değerlendirilmesi şeffaf ve etkindir.
  - Birimde eğitim-öğretim ilkelerine ve kültürüne uyum gözetilmektedir.
  units: TÜM AKADEMİK BİRİMLER, PERSONEL D. B., ÜST YÖNETİM
  rubric:
    1: Birimin atama, yükseltme ve görevlendirme süreçleri tanımlanmamıştır.
    2: Birimin atama, yükseltme ve görevlendirme kriterleri tanımlanmış; ancak planlamada alana özgü ihtiyaçlar irdelenmemiştir.
    3: Birimin tüm alanlar için tanımlı ve paydaşlarca bilinen atama, yükseltme ve görevlendirme kriterleri uygulanmakta ve karar almalarda (eğitim-öğretim kadrosunun işe alınması, atanması, yükseltilmesi ve ders görevlendirmeleri vb.) kullanılmaktadır.
    4: Atama, yükseltme ve görevlendirme uygulamalarının sonuçları izlenmekte ve izlem sonuçları değerlendirilerek önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Öğretim elemanı atama, yükseltme ve görevlendirme kriterlerinin tanımlı ve kamuoyuna açık olduğunu gösterir kanıtlar
  - Akademik kadronun uzmanlık alanı ile yürüttükleri ders arasında uyumun sağlanmasına yönelik uygulamalar
  - Atama, yükseltme ve görevlendirme kriterleri izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.4.2
  title: Öğretim yetkinlikleri ve gelişimi
  parent: B.4
  description:
  - Öğretim yetkinliği geliştirme süreçleri ihtiyaç analizleri temelinde planlanır, yaygın biçimde yürütülür ve etkililiği düzenli olarak izlenir.
  - Tüm öğretim elemanlarının etkileşimli-aktif ders verme yöntemlerini ve uzaktan eğitim süreçlerini öğrenmeleri ve kullanmaları için sistematik eğiticilerin eğitimi etkinlikleri (kurs, çalıştay, ders, seminer vb.) ve bunu üstlenecek/ gerçekleştirecek öğretme-öğrenme merkezi yapılanması vardır.
  - Öğretim elemanlarının pedagojik ve teknolojik yeterlilikleri artırılmaktadır.
  - Birimin öğretim yetkinliği geliştirme performansı değerlendirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, PERSONEL D. B., ÜST YÖNETİM, SEM
  rubric:
    1: Birimde öğretim elemanlarının öğretim yetkinliğini geliştirmek üzere planlamalar bulunmamaktadır.
    2: Birimin öğretim elemanlarının; öğrenci merkezli öğrenme, uzaktan eğitim, ölçme değerlendirme, materyal geliştirme ve kalite güvencesi sistemi gibi alanlardaki yetkinliklerinin geliştirilmesine ilişkin planlar bulunmaktadır.
    3: Birimin genelinde öğretim elemanlarının öğretim yetkinliğini geliştirmek üzere uygulamalar vardır.
    4: Öğretim yetkinliğini geliştirme uygulamalarından elde edilen bulgular izlenmekte ve izlem sonuçları öğretim elamanları ile birlikte irdelenerek önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Eğiticilerin eğitimi uygulamalarına ilişkin planlamalara (kapsamı, veriliş yöntemi, katılım bilgileri vb.) ait kanıtlar (Uzaktan eğitim uygulamaları dahil)
  - Öğrenme öğretme merkezi uygulamalarına ilişkin kanıtlar
  - Eğiticilerin eğitimi uygulamalarına (kapsamı, veriliş yöntemi, katılım bilgileri vb.) ilişkin kanıtlar (Uzaktan eğitim uygulamaları dahil)
  - Eğiticilerin eğitimi dışında öğretim elemanı öğretim yetkinliğinin geliştirilmesine yönelik uygulamalar
  - Eğitim kadrosunun eğitim-öğretim performansını izleme süreçlerini gösteren belgeler ve dokümanlar
  - Öğretim elemanlarının izleme ve iyileştirme süreçlerine katılımını gösteren kanıtlar
  - Öğretim yetkinliği geliştirme süreçlerine ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: B.4.3
  title: Eğitim faaliyetlerine yönelik teşvik ve ödüllendirme
  parent: B.4
  description:
  - Öğretim elemanları için yaratıcı/yenilikçi eğitimi uygulamalarını ve bu alanda rekabeti arttırmak üzere “iyi eğitim ödülü” gibi teşvik ve ödüllendirme süreçleri vardır.
  - Eğitim ve öğretimi önceliklendirmek üzere atama ve yükseltme kriterlerinde yaratıcı eğitim faaliyetlerine yer verilir.
  units: TÜM AKADEMİK BİRİMLER, PERSONEL D. B., ÜST YÖNETİM
  rubric:
    1: Öğretim kadrosuna yönelik teşvik ve ödüllendirilme mekanizmaları bulunmamaktadır.
    2: Teşvik ve ödüllendirme mekanizmalarının; yetkinlik temelli, adil ve şeffaf biçimde oluşturulmasına yönelik planlar bulunmaktadır.
    3: Teşvik ve ödüllendirme uygulamaları Birim geneline yayılmıştır.
    4: Teşvik ve ödül uygulamaları izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Eğitim kadrosunun eğitim-öğretim performansını takdir etmek, tanımak ve ödüllendirmek için kurumun geneline yayılmış teşvik mekanizmaları/tanımlı süreçler
  - Bu alanda yürütülen faaliyetlere ilişkin uygulama örnekleri
  - Eğitim kadrosunun eğitim faaliyetlerine yönelik teşvik ve ödüllendirmeye ilişkin kanıtlar
  - Eğitim kadrosunun eğitim-öğretim performansını takdir-tanıma ve ödüllendirmek üzere yürütülen faaliyetlere ilişkin izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: C.1.1
  title: Araştırma süreçlerinin yönetimi
  parent: C.1
  description:
  - Araştırma süreçlerin yönetimine ilişkin benimsenen yaklaşımlar, motivasyon ve yönlendirme işlevinin nasıl tasarlandığı, kısa ve uzun vadeli hedeflerin net ve kesin nasıl tanımlandığı, araştırma yönetimi ekibi ve görev tanımları belirlenmiştir; uygulamalar bu birimsel/kurumsal tercihler yönünde gelişmektedir.
  - Bilimsel araştırma ve sanatsal süreçlerin yönetiminin etkinliği ve başarısı izlenmekte ve iyileştirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, ÜST YÖNETİM, ARAŞTIRMA KOORD., BAP KOORD., TTO, PROJE TAKIMLARI KOORD, DÖNER SERMAYE İŞLETME MÜDÜRLÜĞÜ
  rubric:
    1: Birimde araştırma süreçlerinin yönetimi ve organizasyonel yapısına ilişkin bir planlama bulunmamaktadır.
    2: Birimin araştırma süreçlerinin yönetimi ve organizasyonel yapısına ilişkin yönlendirme ve motive etme gibi hususları dikkate alan planlamaları bulunmaktadır.
    3: Birimin genelinde araştırma süreçlerin yönetimi ve organizasyonel yapısı Birimsel tercihler yönünde uygulanmaktadır.
    4: Birimde araştırma süreçlerinin yönetimi ve organizasyonel yapısının işlerliği ile ilişkili sonuçlar izlenmekte ve önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Araştırma süreçlerin yönetimi ve organizasyon yapısı
  - Araştırma yönetişim modeli ve uygulamaları
  - Araştırma yönetimi ve organizasyonel yapının işlerliğinin izlendiği ve iyileştirildiğine ilişkin kanıtlar
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: C.1.2
  title: İç ve dış kaynaklar
  parent: C.1
  description:
  - Birimin fiziki, teknik ve mali araştırma kaynakları misyon, hedef ve stratejileriyle uyumlu ve yeterlidir. Kaynakların çeşitliliği ve yeterliliği izlenmekte ve iyileştirilmektedir.
  - Araştırmaya yeni başlayanlar için üniversite içi çekirdek fonlar vardır ve erişimi kolaydır. Araştırma potansiyelini geliştirmek üzere proje, konferans katılımı, seyahat, uzman daveti destekleri, kişisel fonlar, motivasyonu arttırmak üzere ödül ve rekabetçi yükseltme kriterleri vardır. Üniversite içi kaynakların yıllar içindeki değişimi; bu imkanların etkinliği, yeterliliği, gelişime açık yanları, beklentileri karşılama düzeyi değerlendirilmektedir.
  - Misyon ve hedeflerle uyumlu olarak üniversite dışı kaynaklara yönelme desteklenmektedir. Bu amaçla çalışan destek birimleri ve yöntemleri tanımlıdır ve araştırmacılarca iyi bilinir.
  units: TÜM AKADEMİK BİRİMLER, ÜST YÖNETİM, ARAŞTIRMA KOORD., BAP KOORD., TTO, STRATEJİ GELİŞTİRME D. B.
  rubric:
    1: Birimin araştırma ve geliştirme faaliyetlerini sürdürebilmesi için yeterli kaynağı bulunmamaktadır.
    2: Birimin araştırma ve geliştirme faaliyetlerini sürdürebilmek için uygun nitelik ve nicelikte fiziki, teknik ve mali kaynakların oluşturulmasına yönelik planları bulunmaktadır.
    3: Birim araştırma ve geliştirme kaynaklarını araştırma stratejisi ve birimler arası dengeyi gözeterek yönetmektedir.
    4: Birimde araştırma kaynaklarının yeterliliği ve çeşitliliği izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Araştırma-geliştirme bütçesi ve dağılımı
  - Araştırma çerçevesinde yapılan stratejik ortaklıklar (Kamu veya özel)
  - Araştırma-geliştirme kaynaklarının araştırma stratejisi doğrultusunda yönetildiğini gösteren kanıtlar
  - Araştırma kaynaklarının çeşitliliği ve yeterliliğinin izlendiğine ve iyileştirildiğine ilişkin kanıtlar
  - İç kaynaklar ve kullanımına ilişkin tanımlı süreçler (BAP Yönergesi, İç Kaynak Kullanım Yönergesi vb.)
  - İç kaynakların birimler arası dağılımı
  - Dış kaynakların kullanımını desteklemek üzere oluşturulmuş yöntem ve birimler
  - Dış kaynakların dağılımını gösteren kanıtlar
  - Dış kaynaklarda yıllar itibarıyla gerçekleşen değişimler
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: C.1.3
  title: Doktora programları ve doktora sonrası imkanlar
  parent: C.1
  description:
  - Doktora programlarının başvuru süreçleri, kayıtlı öğrencileri ve mezun sayıları ile gelişme eğilimleri izlenmektedir.
  - Birimde doktora sonrası (post-doc) imkanları bulunmaktadır ve birimin kendi mezunlarını işe alma (inbreeding) politikası açıktır.
  units: TÜM ENSTİTÜLER, MEZUNLAR KOORD., ÖĞRENCİ İŞLERİ D. B., PERSONEL D. B., ÜST YÖNETİM, KAGEM, ARAŞTIRMA KOORD.
  rubric:
    1: Birimin doktora programı ve doktora sonrası imkanları bulunmamaktadır.
    2: Birimin araştırma politikası, hedefleri ve stratejileri ile uyumlu doktora programı ve doktora sonrası imkanlarına ilişkin planlamalar bulunmaktadır.
    3: Birimde araştırma politikası, hedefleri ve stratejileri ile uyumlu ve destekleyen doktora programları ve doktora sonrası imkanlar yürütülmektedir.
    4: Birimde doktora programları ve doktora sonrası imkanlarının çıktıları düzenli olarak izlenmekte ve iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
  - Doktora programları ve doktora sonrası imkanlara ilişkin kanıtlar
  - Bu programlar ve imkanlardan yararlanan öğrenci/araştırmacı sayıları ve bunların birimlere göre dağılımı
  - Doktora programları ve doktora sonrası imkanlara yönelik izleme ve iyileştirme kanıtları
  - Standart uygulamalar ve mevzuatın yanı sıra birimin ihtiyaçları doğrultusunda geliştirdiği özgün yaklaşım ve uygulamalarına ilişkin kanıtlar
- id: C.2.1
  title: Araştırma yetkinlikleri ve gelişimi
  parent: C.2
  description:
  - Doktora derecesine sahip araştırmacı oranı, doktora derecesinin alındığı kurumların dağılımı; kümelenme/ uzmanlık birikimi, araştırma hedefleri ile örtüşme konularının analizi, hedeflerle uyumu irdelenmektedir.
  - Akademik personelin araştırma ve geliştirme yetkinliğini geliştirmek üzere eğitim, çalıştay, proje pazarları vb. gibi sistematik faaliyetler gerçekleştirilmektedir.
  units: TÜM AKADEMİK BİRİMLER, PERSONEL D. B., ÜST YÖNETİM, BAP KOORD., TTO, PROJE TAKIMLARI KOORD., ARAŞTIRMA KOORD.
  rubric:
    1: Birimde, öğretim elemanlarının araştırma yetkinliğinin geliştirilmesine yönelik mekanizmalar bulunmamaktadır.
    2: Birimde, öğretim elemanlarının araştırma yetkinliğinin geliştirilmesine yönelik planlar bulunmaktadır.
    3: Birimin genelinde öğretim elemanlarının araştırma yetkinliğinin geliştirilmesine yönelik uygulamalar yürütülmektedir.
    4: Birimde, öğretim elemanlarının araştırma yetkinliğinin geliştirilmesine yönelik uygulamalar izlenmekte ve izlem sonuçları öğretim elemanları ile birlikte değerlendirilerek önlemler alınmaktadır.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
  example_evidence:
