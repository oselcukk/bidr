    4: Birimde araştırma performansı izlenmekte ve ilgili paydaşlarla değerlendirilerek iyileştirilmektedir.
    5: İçselleştirilmiş, sistematik, sürdürülebilir ve örnek gösterilebilir uygulamalar bulunmaktadır.
