version: 2
description: >-
  Bağımsız doğrulama: alan düzeyindeki güçlü / gelişmeye açık yön maddeleri, atıf yaptıkları
  alt ölçütlerin doğrulanmış metni, audit bulguları ve kanıt durumuyla karşılaştırılır; maddeler
  arası çelişki ve hedefin altındaki gösterge de denetlenir → madde başına
  destekleniyor | kismen | desteklenmiyor + gerekçe. Yazarın gerekçesi verilmez.
inputs:
  alan: "alan kodu ve başlığı"
  maddeler: "denetlenecek maddeler: yer (g: güçlü, a: gelişmeye açık), metin"
  olcutler: "maddelerin atıf yaptığı alt ölçütler: OD, PUKÖ zinciri, doğrulanmış metin, bulgular, kanıt durumu"
