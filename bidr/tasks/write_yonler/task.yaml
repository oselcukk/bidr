version: 4
description: >-
  Alan düzeyinde "Güçlü Yönler" ve "Gelişmeye Açık Yönler" maddeleri (FR-0833 son tablosu).
  Girdi: alanın birimce doldurulan alt ölçütlerinin doğrulanmış açıklama metinleri, audit
  bulguları (önerilen OD, PUKÖ zinciri, eksik halkalar, kanıtsız ölçüt) ve kanıt durumu
  (kanıtlı halkalar, listede birime ait kanıt, hedefin altında gösterge). Her madde ilgili
  ölçüt koduna atıf yapar: "(B.1.1)". Kod denetimi: bidr/write/yonler.py (ölçüt atfı,
  dayanak, OD aşımı, yasak ifade ve vaat dili bidr/write/text.py'den; kanıtla ve maddeler
  arası çelişki, hedefin altındaki gösterge `cross_check`).
  v3 (kör test 2026-11-20): bulgular sade dille (iç terim yok); iç dil kuralı ve kod denetimi
  (`ic_dil`); hedefin altındaki göstergenin izleme verisi güçlü yön olmaz; fakülte değeri
  bölümün değeri gibi verilmez (`fakulte_degeri`).
  v4 (kör test 2026-11-20 güncelleme ölçümü): KANIT DURUMU doğrulanmış metnin anlattığı halkayı
  da gösterir ("metinde var", "metinde izleme verisi var"); audit zinciri eksik saysa da metnin
  anlattığı izleme/değerlendirme/iyileştirmenin yokluğu yazılmaz (`kanitla_celiski`, güçlü yönle
  `ic_celiski`); bir belgenin neden bu dönemin kanıtı sayılmadığı yazılmaz (`ic_dil`).
inputs:
  hitap: "kurumsal özne (ör. Bölümümüzde)"
  alan: "alan kodu ve başlığı (ör. B Eğitim ve Öğretim)"
  olcutler: "alanın birimce doldurulan alt ölçütleri: OD, PUKÖ zinciri, doğrulanmış metin, bulgular, kanıt durumu"
  guclu_olcutler: "güçlü yön maddesinin atıf yapabileceği ölçütler (doğrulanmış metni olanlar)"
  gelisme_olcutler: "gelişmeye açık yön maddesinin atıf yapabileceği ölçütler (audit bulgusu olanlar)"
