version: 10
description: >-
  İnce karar. Belge metni + aday alt ölçütlerin rubriği (1-5, birebir) ve kanıt
  yuvaları (PUKÖ aşaması / OD etiketiyle) → her uyan ölçüt için
  {olcut, yuva, asama, od_onerisi, alinti, gerekce, guven}. Alıntı belgeden
  birebir olmalı; kod verify_quote ile denetler, tutmayan eşleşme reddedilir.
  v5: `kurum_geneli` (bool) alanı; kurum geneli düzenlemenin eşleşmeleri kodca
  OD2 ile sınırlanır (bidr/data/profiles/kurum_geneli.yaml).
  v6: kanıt ilkesi `donem_kurali` (yapı/olay belgesi; tarih yüzünden eşleşme reddedilmez,
  döngü tanımı alıntılanır; kod uygular: bidr/data/profiles/donem_kurali.yaml).
  v7: belge düzeyinde `kanit_adi` (3-7 sözcük kanıt dosyası adı; kişi adı/unvan yok). Kod
  kişi/unvan/e-posta içereni reddeder ve işaretler (bidr/name/check.py); ad kurala düşer.
  v8: birim farkındalığı. İsteme birim (ve kurum) adı girer (`birim`, config.yaml `bidr:`);
  `kurum_geneli` (bool) yerine `birim_iliskisi`: kendi | ust_birim_bu_birim_hakkinda |
  fakulte_geneli | kurum_geneli | baska_birim | belirsiz. Kod: fakülte/kurum geneli OD2 tavanı,
  baska_birim eşleşmeleri reddedilir (kanit_degil), belirsiz kabul + işaret. Eski kayıt: alan
  yoksa `kurum_geneli: true` → kurum_geneli, değilse kendi.
  v8 açıklama (sürüm değişmedi, şema aynı): `birim_iliskisi` yalnız belge metninden çıkarılır
  (kişiyi tanıyarak ya da dış bilgiyle birim atanmaz); `kanit_adi` yasaklı karakterleri istemde
  yazılı; kod / \ | : karakterlerini "-" yapar (bidr/name/check.py, kayıtta not).
  v9: isteğe bağlı belge düzeyi `faaliyet` ({ad, tarih, asama} | null): belgenin ait olduğu
  toplantı/etkinlik ve o faaliyetteki yeri (duyuru, plan, gerceklesme, katilim, degerlendirme,
  iyilestirme, duzenleme, diger). Kod faaliyet kayıtlarını toplar (bidr/faaliyet, faaliyetler.json).
  Alan isteğe bağlı: v8 kayıtları geçerli kalır, faaliyetsiz sayılır. Belge metni bütçesi
  8000 → 7300 karakter (istem boyut sınırı).
  v10: OD rubriği (K27). Aşama kuralı sıkılaştı: boş form/şablon, duyuru ve gelecek zamanlı
  ifade uygula değil; katılım sayısı kontrol_et değil; öneri, kurula bilgi, sürüm notu onlem_al
  değil (önlemin gerekçesi dayandığı izleme sonucunu yazar); ozgun birden çok dönem + bağımsız
  tanınma ister, öz-övgü/tanıtım metni değil; bölüm kurulu kararı bölüm uygulamasıdır; fotoğraf
  destekleyici. kanit_degil: herhangi bir yılın BİDR'si/taslağı, giriş ekranı, bağlantı sayfası,
  yürürlükten kalkmış düzenleme. Bölümün kendi usul belgesi `kendi`dir. Kanıt ilkelerine
  `iyilestirme_kaniti`, `ozgunluk_kaniti`. Şema aynı. Kod aynı kuralları ucuz denetimlerle de
  uygular (bidr/audit/savunma.py).
  v10 açıklama (sürüm değişmedi, şema aynı): birimin kendi sayfası/listesi kurum sitesinde olsa da
  `kendi`; metinde birim adı, programı ya da ders kodu varken `belirsiz` denmez. BİRİM bilgisine
  biliniyorsa fakülte girer (config.yaml `bidr.fakulte` ya da kurum profili `birimler:`); kanıt
  ilkesi `madde_ilkesi`: fakülteye göre maddeli kurum düzenlemesinde yalnız birimin fakültesinin
  (ya da ortak) maddesi. Kod: metindeki birim sinyali `belirsiz`i `kendi`ye çevirir, başka
  fakültenin maddesini saymaz (`madde_baska_fakulte`).
  v10 açıklama (sürüm değişmedi, şema aynı): `kanit_adi` alıntıların geldiği belgeyi adlandırır;
  birleştirilmiş dosyada ilk eşleşmenin alıntısının geldiği parça; metinde olmayan tür, yıl,
  nitelik ("ve Ekleri", "Derlemesi") eklenmez. Kod adın belgede dayanağını denetler
  (bidr/name/ground.py; dosyalamada `Resolver` uyarısı, ad `doğrulanmalı`).
inputs:
  adaylar: "aday alt ölçütler: başlık, rubrik 1-5, yuvalar `[aşama → OD]` etiketiyle"
  belge_bilgisi: "documents.jsonl içerik alanları (tür tahmini, tarih, sayfa); yol/ad yok"
  belge_metni: "belge metni; kısaltıldıysa parçalar arası [...]"
  kanit_ilkeleri: "komisyonun kanıt ilkeleri (bidr/data/profiles/kanit_ilkeleri.yaml)"
  birim: "birim adı, biliniyorsa fakültesi ve kurum adı (config.yaml `bidr.birim`, `bidr.fakulte`, `bidr.kurum` profili)"
