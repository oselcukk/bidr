# Kurum profili: Gebze Teknik Üniversitesi kalite yönetim sistemi doküman kodları.
# Yalnız kurumun herkese açık doküman numaraları ve adları; kişi/belge içeriği yok.
#
# Kod, metinde künye bağlamında geçerse ("Form No: FR-0044", "Doküman No YÖ-0007",
# "İŞ AKIŞ NO: İA-0346" ya da hemen ardından "Yayın Tarihi") güçlü tür kanıtıdır.
# Gövdede yalnız anılan kod (ör. "FR-0820 numaralı form") tür kanıtı sayılmaz.
kurum: gtu
ad: Gebze Teknik Üniversitesi
# Kanıt bağlantısı: belge metnindeki bu alan adlarındaki adresler yayın adresi sayılır.
yayin_alan_adlari: [gtu.edu.tr]
# Boş BİDR rapor şablonunun (FR-0833 .docx) indirme adresi. Doluysa kurulumda ajan şablonu
# buradan indirir (config.yaml `rapor.sablon`); boşsa kullanıcıdan şablon dosyası istenir.
# Doğrulanmış resmî adres bilinmiyor: boş bırakıldı.
sablon_adresi:
# Kod biçimi: iki harfli önek + 4 hane. Önekler Türkçe harfsiz (katlanmış) yazılır.
onekler:
  fr: FR   # form
  yo: YÖ   # yönerge
  yn: YN   # yönetmelik
  ia: İA   # iş akışı
  an: AN   # anket
  pr: PR   # prosedür
# Önek -> tür (kod tek tek listelenmemişse).
onek_turleri:
  YÖ: yonerge
  YN: yonetmelik
  İA: is_akisi
  AN: anket_formu
# Birimlerin metinde aranan açık sinyalleri (bidr/audit/savunma.py; config.yaml `bidr:` aşar):
# bağlı olduğu fakülte (fakülteye göre maddeli kurum düzenlemelerinde doğru madde) ve ders kodu
# önekleri (ör. "MATH407", "MAT 113"). Yalnız kurumun herkese açık ders kataloğundaki önekler.
birimler:
  - ad: Matematik Bölümü
    fakulte: Temel Bilimler Fakültesi
    ders_kodlari: [MATH, MAT]
  - ad: Kimya Bölümü
    fakulte: Temel Bilimler Fakültesi
    ders_kodlari: [CHEM, KİM, KIM]
kod_agirligi: 6
kodlar:
  FR-0044: {tur: toplanti_tutanagi, ad: Toplantı Tutanağı}
  FR-0274: {tur: katilim_listesi, ad: Toplantı Katılım Listesi}
  FR-0833: {tur: bidr_raporu, ad: Birim İç Değerlendirme Raporu}
  FR-0069: {tur: staj_belgesi, ad: Staj Defteri}
  FR-0080: {tur: staj_belgesi, ad: Staj Değerlendirme Belgesi-Anketi}
  FR-0185: {tur: staj_belgesi, ad: Stajı Değerlendirme Anketi}
  FR-0186: {tur: staj_belgesi, ad: Stajyerin Kurumu Değerlendirme Anketi}
  FR-0336: {tur: staj_belgesi, ad: Gönüllü Staj Belgesi}
  FR-0338: {tur: staj_belgesi, ad: Staj Zorunluluk Belgesi}
  FR-0356: {tur: yonerge, ad: Yönerge şablonu}
  FR-0375: {tur: yonetmelik, ad: Yönetmelik şablonu}
  FR-0138: {tur: is_akisi, ad: İş akışı şablonu}
  FR-0208: {tur: dilekce_basvuru, ad: Sınav Sonucuna İtiraz Dilekçesi}
  FR-0067: {ad: Diploma Talep Formu}
  FR-0181: {ad: Araştırma Görevlileri Faaliyet Takip Çizelgesi}
  FR-0428: {ad: Doktor Öğretim Üyesi Atama Yenileme Talep Formu}
  FR-0518: {ad: Yenilenen Ders Planı Uygunluk Formu}
  FR-0587: {ad: Bitirme Projesi Değerlendirme Formu}
  FR-0754: {ad: Lisans Müşterek Jüri Raporu}
  FR-0820: {ad: Yeni Ders Açma Öneri Formu}
# Kurum belge kataloğu (bidr kurum-katalog cek): herkese açık liste sayfaları. Yalnız sayfa (HTML)
# indirilir; listedeki ek dosyalar indirilmez. tur: yonetmelik | yonerge | usul_esas | is_akisi |
# form | anket | talimat (yönerge sayfasında "Usul ve Esaslar" adlı öğe usul_esas, form sayfasında
# "Anket" adlı öğe anket olur).
katalog:
  - ad: Yönetmelikler
    adres: https://www.gtu.edu.tr/kategori/3074/0/display.aspx
    tur: yonetmelik
  - ad: Yönergeler ve usul-esaslar
    adres: https://www.gtu.edu.tr/kategori/3075/0/display.aspx
    tur: yonerge
  - ad: Kalite Ofisi iş akışları
    adres: https://www.gtu.edu.tr/kategori/2381/0/display.aspx
    tur: is_akisi
  - ad: Kalite Ofisi formlar ve anketler
    adres: https://www.gtu.edu.tr/kategori/2382/0/display.aspx
    tur: form
  - ad: Cihaz kullanım talimatları
    adres: https://www.gtu.edu.tr/kategori/3103/0/display.aspx
    tur: talimat
    etkin: false
    not: laboratuvar cihaz talimatları (~450); BİDR ölçütleriyle ilgisiz, çekilmez
# Kişisel veri maskeleme (`bidr maskele`): kurumun öğrenci numarası biçimi. Çalışma alanının
# `privacy.maskeleme.ogrenci_no_desenleri`ne (ya da varsayılanlara) EKLENİR. Öğrenci numaraları
# 12 hane: iki haneli giriş yılı + birim/program kodu + sıra (ör. 24 05 ……). Etiketsiz (tablo
# hücresinde) de yakalanır; önünde harf/`-`/`/`/`.` ya da arkasında `-`/`/`/`.`+rakam varsa
# (belge/evrak kodu parçası) ve "Sayı:", "Proje No:" gibi belge kimliği bağlamında alınmaz.
privacy:
  maskeleme:
    ogrenci_no_desenleri:
      - '(?<![\w\-/.=%])[1-3]\d{11}(?!\d)(?![\-/.]\d)'
