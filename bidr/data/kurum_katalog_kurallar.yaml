    olcutler: [A.2.2, A.2.3]
  - desen: misyon|vizyon|politika
    olcutler: [A.2.1]
  - desen: bolum baskan|dekan|kurul|komisyon|senato|organizasyon|yonetisim|gorev tanim|yetki devri|secim
    olcutler: [A.1.1]
  - desen: etik deger|etik sozlesme|liderlik|kalite kultur
    olcutler: [A.1.2]
  - desen: kisisel veri|bilgi yonetim|bilgi guvenli|veri koruma|aydinlatma metni
