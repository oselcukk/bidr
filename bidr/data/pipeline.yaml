# BİDR hattının aşama sözleşmeleri (veri). Okuyan: `bidr.pipeline` (`bidr status`,
# `bidr next`, kapılar). Ajan talimatları (AGENTS.md, skill'ler) bu dosyaya ve
# `bidr next` çıktısına dayanır; tamamlanma şartını model değil kod denetler.
#
# Alanlar:
#   id         aşama kimliği (kapılar ve CLI bunu kullanır)
#   ad         okunur ad
#   uygulandi  false: aşama henüz yazılmadı; `bidr next` hattın orada bittiğini söyler
#   istege_bagli  true: aşama koşula bağlı (denetimi `atlandi` döndürebilir); uygulanmamışsa da
#              hattı durdurmaz (atlandi görünür)
#   katman     D (belirleyici kod) | M (model işi: ajan yapar) | I (insan)
#   onkosul    bitmiş (ya da atlanmış) olması gereken aşamalar
#   girdi/cikti  çalışma alanındaki dosyalar (bilgi amaçlı)
#   komut      sıradaki komut(lar); {ws} {kaynak} {profil} {donem} {kurum} {etiket_birim}
#              {egitim} {ajan} yer tutucuları config.yaml'ın `bidr:` bölümünden doldurulur
#   sart.denetim  bidr/pipeline/checks.py'deki denetim işlevinin adı
#   sart.metin    tamamlanma şartının insan/ajan için açıklaması
#   onay       yok | insan  (insan: aşama kullanıcının kararı olmadan bitemez)
#   skill      bu aşamada okunacak skill
#   paralel    (yalnız M aşamaları) bölünebilir mi: `bolunebilir: true|false` + `gerekce`; bölünebilirse
#              `dizin` (paket klasörü), `duzen` (dosya: <anahtar>.json | klasor: <anahtar>/<anahtar>.json),
#              isteğe bağlı `anahtar` (paket adı deseni) ve `grup` (alt_bolum: A.1.x ölçütleri aynı parçada).
#              `bidr parcala` cevapsız paketleri ayrık parça listelerine böler (docs/MODEL_LAYER.md "Paralel").
surum: 1
asamalar:
  - id: kurulum
    ad: Çalışma alanı kurulumu
    uygulandi: true
    katman: I
    onkosul: []
    girdi: [answers.yaml (kullanıcının cevapları)]
    cikti: [config.yaml (bidr bölümü), AGENTS.md, CLAUDE.md]
    komut: ["bidr init -w {ws} --answers <answers.yaml>"]
    sart:
      denetim: config_gecerli
      metin: >-
        config.yaml'da geçerli bir `bidr:` bölümü var: kaynak klasör var ve okunabilir,
        çalışma alanı kaynağın ve bidr reposunun dışında, profil/kurum tanınıyor, dönem bir yıl.
    onay: insan
    skill: bidr-kur

  - id: ingest
    ad: Belge tarama ve metin çıkarma
    uygulandi: true
    katman: D
    onkosul: [kurulum]
    girdi: [kaynak klasör (salt okunur)]
    cikti: [inventory.csv, text/<doc_id>.txt]
    komut: ["bidr ingest {kaynak} -w {ws}"]
    sart:
      denetim: ingest_tamam
      metin: >-
        Kaynaktaki her dosya inventory.csv'de bir satır; iCloud'da indirilmemiş dosya yok;
        metni çıkarılan (ok/ocr) her belgenin text/<doc_id>.txt dosyası var.
    onay: yok
    skill: bidr-rapor

  - id: transcribe
    ad: Görsel okuma (düşük kaliteli belgeler; model işi ajanda)
    uygulandi: true
    istege_bagli: true
    katman: M
    onkosul: [ingest]
    girdi: [inventory.csv (low_quality), kaynak PDF/görseller (salt okunur)]
    cikti: [work/transcribe/<doc_id>/, text/<doc_id>.txt (görsel okumayla)]
    komut:
      - "bidr transcribe prepare -w {ws} --all-low-quality"
      - "(ajan) work/transcribe/README.md'ye göre her <doc_id>/ için görüntüleri okuyup <doc_id>.out.json yaz"
      - "bidr transcribe apply -w {ws} --model {ajan}"
    sart:
      denetim: transcribe_tamam
      metin: >-
        Düşük kaliteli (görsel/PDF) belge yoksa atlanır. Varsa her biri ajanın görsel okumasıyla
        yazıya geçirilmiş ve apply ile işlenmiş; geçersiz/şüpheli cevap yok. Reddedilen cevap kenara
        alınıp yeniden okunur; aynı nedenle iki kez reddedilen belge elle bakılmalı işaretlenir (metni
        OCR'da kalır, ELLE-BAKILMALI.md) ve aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/transcribe
      duzen: klasor
      gerekce: >-
        Paket tek belgenin sayfa görüntüleri; istem başka belge görmez, cevap yalnız o belgenin metnini yazar. Belgeler arası bağlantı (PUKÖ, faaliyet, OD) modelsiz aşamalarda (faaliyet, audit) bütün kararlardan kurulur.

  - id: describe
    ad: Görsel betimleme (metni az fotoğraf/afiş/tabela; model işi ajanda)
    uygulandi: true
    istege_bagli: true
    katman: M
    onkosul: [ingest]
    girdi: [inventory.csv, text/ (seyreklik), kaynak görseller/PDF/docx (salt okunur), belge-notlari.yaml (isteğe bağlı; bölümün belge notu, ipucu)]
    cikti: [work/describe/<doc_id>/, text/<doc_id>.txt (betimleme; başında BETİMLEME işareti), describe.jsonl]
    komut:
      - "bidr describe prepare -w {ws} --auto"
      - "(ajan) work/describe/README.md'ye göre her <doc_id>/ için görüntüleri betimleyip <doc_id>.out.json yaz"
      - "bidr describe apply -w {ws} --model {ajan}"
    sart:
      denetim: describe_tamam
      metin: >-
        Metni seyrek (sağlıklı sözcük < 30) görüntü dosyası, görsel ağırlıklı PDF sayfası ya da gövdesi
        seyrek docx'in gömülü görseli yoksa atlanır. Varsa her biri ajanca betimlenmiş ve apply ile
        işlenmiş (ya da ajan 'metin sayfası' dedi: uyarı, transcribe önerilir); geçersiz/şüpheli cevap yok.
        transcribe ile sırası serbest: ikisi de uygulanırsa yazıya geçirilen metin betimlemenin altında kalır.
        Reddedilen cevap kenara alınıp yeniden istenir; aynı nedenle iki kez reddedilen belge elle bakılmalı
        işaretlenir (betimleme yok sayılır, metni OCR'da kalır, ELLE-BAKILMALI.md) ve aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/describe
      duzen: klasor
      gerekce: >-
        Paket tek belgenin görselleri; betimleme belgeye özgüdür, başka belgeye bakılmaz.

  - id: etiketler
    ad: Geçmiş etiketler (isteğe bağlı)
    uygulandi: true
    katman: D
    onkosul: [kurulum]
    girdi: [kaynak klasör (geçmiş yılın BİDR raporu ve kanıt klasör adları)]
    cikti: [labels.jsonl, labels-report.md]
    komut: ["bidr labels build {kaynak} -w {ws} --unit {etiket_birim}"]
    sart:
      denetim: etiket_tamam
      metin: >-
        config'de gecmis_etiket: false ise atlanır. Değilse labels.jsonl var ve boş değil.
        Etiketler yalnız karşılaştırma/hakem içindir; sınıflandırıcıya gösterilmez.
    onay: yok
    skill: bidr-rapor

  - id: identify
    ad: Belge türü, tarih, sürüm
    uygulandi: true
    katman: D
    onkosul: [ingest, transcribe, describe]
    girdi: [text/]
    cikti: [documents.jsonl, identify-report.md]
    komut: ["bidr identify -w {ws} --period {donem}{kurum_arg}"]
    sart:
      denetim: identify_tamam
      metin: "text/ altındaki her belgenin documents.jsonl'de kaydı var."
    onay: yok
    skill: bidr-rapor

  - id: candidates
    ad: Aday ölçütler (belirleyici)
    uygulandi: true
    katman: D
    onkosul: [identify]
    girdi: [text/, documents.jsonl]
    cikti: [candidates.jsonl]
    komut: ["bidr candidates -w {ws} --profile {profil}{egitim_arg}"]
    sart:
      denetim: candidates_tamam
      metin: "documents.jsonl'deki her belgenin candidates.jsonl'de satırı var."
    onay: yok
    skill: bidr-rapor

  - id: karar_kaba
    ad: Kaba karar (46 başlıktan seçim; model işi ajanda)
    uygulandi: true
    katman: M
    onkosul: [candidates]
    girdi: [text/, documents.jsonl, candidates.jsonl, belge-notlari.yaml (isteğe bağlı; bölümün belge notu, ipucu)]
    cikti: [work/coarse/<doc_id>.json, work/coarse/<doc_id>.out.json, decisions.jsonl]
    komut:
      - "bidr decide prepare -w {ws} --stage coarse --profile {profil}"
      - "(ajan) work/coarse/README.md'ye göre her paket için <doc_id>.out.json yaz"
      - "bidr decide apply -w {ws} --stage coarse --model {ajan}"
    sart:
      denetim: karar_tamam
      asama: coarse
      metin: >-
        text/ altındaki her belgenin decisions.jsonl'de kaba kaydı var (ya da kodca
        atlandı: öz-referans türü, boş metin); bekleyen ya da geçersiz cevap yok. Geçersiz cevap kenara
        alınıp yeniden istenir; aynı nedenle iki kez reddedilen belge elle bakılmalı: model kararı yok,
        insan incelemesine düşer (review.xlsx İnceleme 1. bölüm), aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/coarse
      duzen: dosya
      gerekce: >-
        Paket tek belge + profilin ölçüt listesi; belge başına bağımsız karar. Zincir (PUKÖ), faaliyet ve OD modelsiz `bidr faaliyet` / `bidr audit`'te bütün kararlar birlikte okunarak kurulur; bölme onları etkilemez.

  - id: karar_ince
    ad: İnce karar (rubrik, yuva, OD, birebir alıntı; model işi ajanda)
    uygulandi: true
    katman: M
    onkosul: [karar_kaba]
    girdi: [decisions.jsonl (kaba), text/, belge-notlari.yaml (isteğe bağlı; bölümün belge notu, ipucu)]
    cikti: [work/fine/<doc_id>.json, work/fine/<doc_id>.out.json, decisions.jsonl]
    komut:
      - "bidr decide prepare -w {ws} --stage fine --profile {profil}"
      - "(ajan) work/fine/README.md'ye göre her paket için <doc_id>.out.json yaz"
      - "bidr decide apply -w {ws} --stage fine --model {ajan}"
    sart:
      denetim: karar_tamam
      asama: fine
      metin: >-
        Kaba kaydı olan her belge ince aşamada (asama: ince); bekleyen ya da geçersiz
        cevap yok. Alıntısı belgede birebir tutmayan eşleşme kodca reddedilir ve
        kullanılmaz (uyarı olarak gösterilir, bir kez yeniden denenir). Geçersiz cevap kaba karardaki
        gibi kenara alınır; ikinci ret → elle bakılmalı (insan incelemesi), aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/fine
      duzen: dosya
      gerekce: >-
        Paket tek belge + aday ölçütlerin rubriği; alıntı yalnız o belgeden. Belgeler arası bağlantı ve OD toplamı modelsiz aşamalarda (faaliyet, audit) kurulur; parça dağılımı sonucu değiştirmez.

  - id: belirsiz_okuma
    ad: Birimi belirsiz OCR'lı belgelerin görsel yeniden okuması (koşullu; model işi ajanda)
    uygulandi: true
    katman: M
    onkosul: [karar_ince]
    girdi: [decisions.jsonl (birim_iliskisi belirsiz), inventory.csv (method/low_quality), transcribe.jsonl,
            kaynak PDF/görseller (salt okunur)]
    cikti: [work/transcribe/<doc_id>/ (tur belirsiz), work/transcribe/belirsiz.json, text/<doc_id>.txt,
            transcribe.jsonl (tur belirsiz)]
    komut:
      - "bidr transcribe prepare -w {ws} --belirsiz"
      - "(ajan) work/transcribe/README.md'ye göre her cevapsız <doc_id>/ için görüntüleri okuyup <doc_id>.out.json yaz"
      - "bidr transcribe apply -w {ws} --model {ajan}"
    sart:
      denetim: belirsiz_okuma_tamam
      metin: >-
        Aday: ince kararda `birim_iliskisi: belirsiz` kalan, insan birim kararı olmayan, metni OCR'dan gelen
        (ya da low_quality=1), PDF/görsel (en çok 40 sayfa) ve görsel okumadan hiç geçmemiş belge. Aday yoksa
        kendiliğinden biter. Varsa her biri ajanın görsel okumasıyla yeniden okunmuş ve apply ile işlenmiş
        (paketlenemeyen aday belirsiz.json'a yazılır, beklenmez). Metni değişen belgenin kararları geçersiz
        kılınır: bidr next identify → candidates → kaba → ince kararı yalnız o belgeler için yeniden ister;
        metni değişmeyen belgenin kararı korunur. Belge başına bir tur (transcribe.jsonl kaydı olan aday
        olmaz). Sonra da belirsiz kalan belge komisyona gider (audit, gaps.md "Birim aitliği doğrulanmalı").
        Kadro adı, grup bağlamı ya da klasör adıyla birim kabul edilmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/transcribe
      duzen: klasor
      gerekce: >-
        Görsel okuma gibi: paket tek belgenin görüntüleri.

  - id: hakem
    ad: Geçmiş etiketle karşılaştırma ve hakem kararları
    uygulandi: true
    katman: I
    onkosul: [karar_ince, belirsiz_okuma, etiketler]
    girdi: [decisions.jsonl, labels.jsonl]
    cikti: [label-compare.md, label-review.md, label-review.jsonl, label-answers.jsonl, consensus-labels.jsonl]
    komut:
      - "bidr compare-labels -w {ws}"
      - "(insan) hakem sorularını cevapla (skill: bidr-hakem) → label-answers.jsonl"
      - "bidr compare-labels -w {ws} --apply"
    sart:
      denetim: hakem_tamam
      metin: >-
        Geçmiş etiket yoksa atlanır. Değilse hakem kuyruğu güncel kararlardan üretilmiş,
        her soruya kullanıcıdan geçerli bir cevap alınmış (belirsiz de cevaptır) ve
        consensus-labels.jsonl cevaplardan sonra yazılmış.
    onay: insan
    skill: bidr-hakem

  - id: name
    ad: Kanıt adları ve derleme belgelerin parça adları (model önerisi; model işi ajanda)
    uygulandi: true
    istege_bagli: true
    katman: M
    onkosul: [karar_ince, belirsiz_okuma]
    girdi: [decisions.jsonl (kabul edilmiş eşleşmeler), documents.jsonl, text/, belge-notlari.yaml (isteğe bağlı; bölümün belge notu, ipucu)]
    cikti: [work/name/<doc_id>.json, kanit-adlari.jsonl (kaynak: model)]
    komut:
      - "bidr name prepare -w {ws}"
      - "(ajan) work/name/README.md'ye göre her paket için <doc_id>.out.json yaz"
      - "bidr name apply -w {ws} --model {ajan}"
    sart:
      denetim: name_tamam
      metin: >-
        Kabul edilmiş eşleşmesi olan her belgenin (mükerrer kopyalar hariç) model ya da insan kanıt adı
        var (kanit-adlari.jsonl ya da ince kararın kanit_adi'sı). Derleme/birleşik belge (birden çok doküman
        kodu, alıntılar farklı parçalardan ya da ad alıntının parçasında tutmuyor) için parça adı da sorulmuş
        (görevin güncel sürümüyle model kaydı, `derleme: true`); `bidr name prepare` bunları kendiliğinden
        paketler, aday yoksa parça adı adımı kendiliğinden biter. config.yaml rapor.kanit_adi_modeli: false
        ise ya da adlandırılacak belge yoksa atlanır; ad önceliği insan > model parça adı > model > kural.
        Reddedilen ad cevabı kenara alınıp yeniden istenir; aynı nedenle ikinci ret → belge kural adında
        kalır (elle bakılmalı), aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/name
      duzen: dosya
      gerekce: >-
        Ad belge başına; istem yalnız o belgenin metni ve eşleştiği ölçütler. Adlandırma kuralları her parçada aynı istemde.

  - id: faaliyet
    ad: Faaliyet kayıtları (aynı toplantı/etkinliğin belgeleri; belirleyici)
    uygulandi: true
    katman: D
    onkosul: [karar_ince, belirsiz_okuma]
    girdi: [decisions.jsonl (ince kararların faaliyet alanı)]
    cikti: [faaliyetler.json]
    komut: ["bidr faaliyet -w {ws}"]
    sart:
      denetim: faaliyet_tamam
      metin: >-
        faaliyetler.json güncel decisions.jsonl'den üretilmiş (içerik kodla yeniden hesaplanıp karşılaştırılır;
        ikinci arama ya da yeniden karar kararları değiştirirse eskir). Yalnız duyurusu olan faaliyet uyarıdır:
        metinde "düzenlenmiştir" denemez. Yazım paketine ölçütün kanıtlarının faaliyet özeti buradan girer.
    onay: yok
    skill: bidr-rapor

  - id: audit
    ad: Ölçüt OD'si, eksik kanıt raporu ve inceleme tablosu
    uygulandi: true
    katman: D
    onkosul: [karar_ince, belirsiz_okuma, hakem, name, faaliyet]
    girdi: [decisions.jsonl, documents.jsonl, kanit-adlari.jsonl]
    cikti: [review.xlsx, gaps.md, audit-olcutler.json, review-decisions.jsonl, slot-tags-oneri.yaml,
            kanit-adlari.jsonl (kaynak: insan), kanit-baglantilari.jsonl (kaynak: insan)]
    komut:
      - "bidr audit -w {ws} --profile {profil}"
      - "(insan) review.xlsx: her satıra KARAR (kabul/ret/duzelt); isteğe bağlı yuva etiketi kararı, kanıt adı, bağlantı ve not"
      - "bidr audit apply -w {ws}"
    sart:
      denetim: audit_tamam
      metin: >-
        review.xlsx güncel kararlardan (decisions.jsonl) üretilmiş; tablodaki her satırın geçerli
        bir kararı var (kabul/ret/duzelt) ve kararlar `bidr audit apply` ile
        review-decisions.jsonl'e işlenmiş (kanıt adı/bağlantı düzeltmeleri de). Önerilen OD ve gaps.md bu
        kararlarla hesaplanır; düşük güvenli eşleşme kabul/duzelt kararıyla OD'ye katılır;
        yuva etiketi düzeltmeleri yalnız slot-tags-oneri.yaml önerisi olur (etiket dosyası değişmez).
        İkinci arama eşleşme eklerse decisions.jsonl değişir: tablo eskir, audit yeniden çalışır ve yeni
        satırlar insan kararı bekler.
    onay: insan
    skill: bidr-rapor

  - id: ikinci_arama
    ad: İkinci arama (kanıtsız/zayıf ölçütler için arşivde ters arama; isteğe bağlı, model işi ajanda)
    uygulandi: true
    istege_bagli: true
    katman: M
    onkosul: [audit]
    girdi: [audit-olcutler.json (zayıf ölçütler), decisions.jsonl, text/]
    cikti: [work/ikinci_arama/<doc_id>.json, work/ikinci_arama/<doc_id>.out.json, decisions.jsonl (işaretli eşleşmeler)]
    komut:
      - "bidr arama prepare -w {ws} --profile {profil}"
      - "(ajan) work/ikinci_arama/README.md'ye göre her paket için <doc_id>.out.json yaz"
      - "bidr arama apply -w {ws} --model {ajan}"
    sart:
      denetim: ikinci_arama_tamam
      metin: >-
        config.yaml rapor.ikinci_arama: false ise atlanır (status'ta atlandi görünür). Değilse `arama prepare`
        çalışmış, her paket cevaplanmış ve apply ile işlenmiş; geçersiz, eski sürüm ya da eski paket (ilk geçiş
        yeniden karara bağlandı) yok. Kabul edilen eşleşme decisions.jsonl'i değiştirir: audit yeniden çalışır,
        yeni satırları kullanıcı inceler; sonra bu aşama bitti olur. Geçersiz cevap kenara alınıp yeniden
        istenir; ikinci ret → o belgeye eşleşme eklenmez (elle bakılmalı), aşamayı bekletmez.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/ikinci_arama
      duzen: dosya
      gerekce: >-
        Arşiv taraması (ölçüt başına belge seçimi) prepare'de kodla yapılır; paket tek belge + ona seçilen zayıf ölçütler (bir belgenin bütün ölçütleri aynı pakette). Model başka belgeye bakmaz.

  - id: file
    ad: Kanıt dosyalama (evidence/A/A.1/…, evidence-index.csv, bağlantılar)
    uygulandi: true
    katman: D
    onkosul: [audit, ikinci_arama]
    girdi: [decisions.jsonl, review-decisions.jsonl, kanit-adlari.jsonl, kanit-baglantilari.jsonl, inventory.csv,
            text/, kaynak klasör (salt okunur), config.yaml rapor.kanit_kok_baglanti]
    cikti: [evidence/, evidence-index.csv (baglanti, baglanti_kaynagi), gaps.md (bağlantı yok bölümü)]
    komut: ["bidr file -w {ws}"]
    sart:
      denetim: file_tamam
      metin: >-
        evidence-index.csv ve evidence/ güncel kararlardan, inceleme kararlarından, kanıt adlarından ve
        bağlantılardan, güncel kesim kuralıyla (dosya tam; birleşik dosyada her belge kendi bütün
        sayfalarıyla; alıntı sayfasına kesilmez) üretilmiş (özetler tutuyor). Kopyalanamayan dosya ve
        bağlantısız kanıt uyarıdır.
    onay: yok
    skill: bidr-rapor

  - id: write
    ad: Ölçüt açıklamalarının yazımı (model işi ajanda)
    uygulandi: true
    katman: M
    onkosul: [file]
    girdi: [evidence-index.csv, audit-olcutler.json, text/, config.yaml rapor.onceki_rapor, rapor-notlari.yaml]
    cikti: [work/write/<ölçüt>.json, texts/<ölçüt>.json (durum taslak), write-kod-denemeleri.json, write-insan.jsonl]
    komut:
      - "bidr write prepare -w {ws}"
      - "(ajan) work/write/README.md'ye göre her paket için <ölçüt>.out.json yaz"
      - "bidr write apply -w {ws} --model {ajan}"
    sart:
      denetim: write_tamam
      metin: >-
        Kanıtı olan her ölçütün texts/<ölçüt>.json metni var, kanıt listesi ve önerilen OD'si güncel ve
        bekleyen (cevapsız, geçersiz ya da işlenmemiş) paket yok; yeniden yazım turu paketleri dahil.
        Yeniden yazım sınırından sonra kod denetimini hâlâ geçemeyen ölçüt için kullanıcı karar verir
        (bidr write karar: cikar | tekrar | kabul; kabul yalnız üslup bulgularında). Şemaya uymayan cevap da
        bir denemedir; sınırın altında geçemeyen cevap kenara alınır (ajan yeni cevap yazar, üstüne değil).
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/write
      duzen: dosya
      anahtar: '[A-E]\.\d+\.\d+'
      grup: alt_bolum
      gerekce: >-
        Paket tek ölçüt: ölçütün bütün kanıtları, faaliyet özeti ve PUKÖ bilgisi aynı pakette (ölçütün zinciri bölünmez). Aynı alt bölümün (A.1, A.2 …) ölçütleri aynı faaliyeti farklı anlatmasın diye tek parçada kalır.

  - id: verify
    ad: Metin doğrulama (kod + bağımsız ajan) ve yeniden yazım döngüsü
    uygulandi: true
    katman: M
    onkosul: [write]
    girdi: [texts/, evidence-index.csv, audit-olcutler.json, text/]
    cikti: [work/verify/<ölçüt>.json, verify.jsonl, texts/<ölçüt>.json (durum dogrulandi|reddedildi), verify-insan.jsonl]
    komut:
      - "bidr verify prepare -w {ws}"
      - "(taze, metni yazmamış ajan) work/verify/README.md'ye göre her paket için <ölçüt>.out.json yaz"
      - "bidr verify apply -w {ws} --model {ajan}"
    sart:
      denetim: verify_tamam
      metin: >-
        Her metnin güncel doğrulama kaydı var (dogrulandi ya da reddedildi). Reddedilen ölçüt
        `bidr write prepare --reddedilenler` ile doğrulayıcının cümle bazlı gerekçesiyle yeniden yazılır ve
        yeniden doğrulanır; config.yaml rapor.yeniden_yazim_siniri (vars. 2) turdan sonra hâlâ reddedilen ölçüt
        için kullanıcı karar verir (bidr verify karar: cikar | tekrar | kabul). Geçersiz doğrulama cevabı kenara
        alınıp yeniden istenir; aynı nedenle ikinci ret → metin doğrulanamadı, yeniden yazım turu olmadan bölümün
        kararına gider.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/verify
      duzen: dosya
      anahtar: '[A-E]\.\d+\.\d+'
      gerekce: >-
        Paket tek ölçütün metni ve atıf yaptığı kanıtlar; doğrulayıcı yazarın paketini görmez (parça ajanları da yazım ajanlarından ayrı, taze olmalı). Ölçüt başına bağımsız.

  - id: yonler
    ad: Güçlü / Gelişmeye Açık Yönler (alan düzeyi; model işi ajanda, doğrulama verify akışında)
    uygulandi: true
    katman: M
    onkosul: [verify]
    girdi: [texts/ (doğrulanmış metinler), audit-olcutler.json, evidence-index.csv, profil/config.yaml rapor.kapsam]
    cikti: [work/yonler/<alan>.json, yonler/<alan>.json, work/verify/yonler/<alan>.json, verify-yonler.jsonl]
    komut:
      - "bidr yonler prepare -w {ws}"
      - "(ajan) work/yonler/README.md'ye göre her paket için <alan>.out.json yaz"
      - "bidr yonler apply -w {ws} --model {ajan}"
      - "bidr verify prepare -w {ws}   # (taze, maddeleri yazmamış ajan) work/verify/yonler/ → bidr verify apply"
    sart:
      denetim: yonler_tamam
      metin: >-
        Birimin doldurduğu ölçütü olan her alanın (A, B, C, D) yonler/<alan>.json maddeleri var, girdileri (doğrulanmış
        ölçüt metinleri, audit bulguları) güncel ve bağımsız doğrulama kaydı oturmuş (dogrulandi ya da reddedildi).
        Her madde ölçüt koduna atıf yapar; güçlü yön yalnız doğrulanmış metinden, gelişmeye açık yön yalnız audit
        bulgusundan çıkar (kod denetler). Reddedilen alan `bidr yonler prepare --reddedilenler` ile yeniden yazılır;
        rapor.yeniden_yazim_siniri turdan sonra hücreler şablon yönergesiyle kalır (rapor TASLAK, uyarı).
        Geçersiz cevap kenara alınıp yeniden istenir; yazım cevabı aynı nedenle iki kez reddedilen alanın hücreleri
        şablon yönergesiyle kalır, doğrulama cevabı iki kez reddedilen alan bölümün kararına gider.
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: false
      gerekce: >-
        Alan (A–D) düzeyinde en çok 4 paket; maddeler alanın bütün doğrulanmış metinlerinden ve bulgularından çıkar, alanlar arası denge ve tekrar raporun bütününde okunur. Bölmenin kazancı yok, tutarlılık riski var.

  - id: render
    ad: Rapor üretimi (report.docx; kanıt adları bağlantılı)
    uygulandi: true
    katman: D
    onkosul: [yonler]
    girdi: [config.yaml rapor.sablon (boş FR-0833 .docx, salt okunur), texts/, yonler/, audit-olcutler.json,
            evidence-index.csv, config.yaml rapor.hazirlayanlar ve rapor.kapsam]
    cikti: [report.docx, .bidr-render.json, gaps.md (bağlantı yok ve kapsam kararı bölümleri)]
    komut: ["bidr render -w {ws}"]
    sart:
      denetim: render_tamam
      metin: >-
        report.docx güncel girdilerden (şablon, metinler, alan maddeleri, audit, kanıt dizini, hazırlayanlar,
        kapsam) üretilmiş. Belge şu durumlarda TASLAK damgalıdır (uyarı): doğrulanmamış metin, boş ya da şablon
        yönergesi kalan güçlü/gelişmeye açık yön hücresi, boş `rapor.hazirlayanlar` (kapak yer tutucuları kalır),
        kapsam kararı gereken ölçüt (gaps.md'de soru). Şablon yolu bilinmiyorsa kullanıcıdan alınır.
    onay: yok
    skill: bidr-rapor

  - id: denetle
    ad: Biçim denetimi (report.docx kılavuz kurallarına göre; yayıma hazır mı)
    uygulandi: true
    katman: D
    onkosul: [render]
    girdi: [report.docx, config.yaml rapor.sablon ve rapor.denetim, evidence/, evidence-index.csv]
    cikti: [denetim.json]
    komut: ["bidr denetle -w {ws}"]
    sart:
      denetim: denetle_tamam
      metin: >-
        denetim.json güncel report.docx'e ait (docx_sha) ve kritik bulgu yok. Kritik bulgu varsa rapor
        "yayıma hazır değil": bulgular gösterilir, kaynağı (metin, kapsam, hazırlayanlar, şablon) düzeltilip
        render ve denetle yeniden çalışır; report.docx elle düzenlenirse denetim yeniden ister. Uyarılar engel değildir.
    onay: yok
    skill: bidr-rapor

  - id: kanit_maskele
    ad: Kanıt maskelemesi (teslim paketinden önce önerilir; yalnız kişisel veri maskelemesini seçen bölümde)
    uygulandi: true
    istege_bagli: true
    katman: D
    onkosul: [file]
    girdi: [evidence/, config.yaml privacy.maskeleme, maskeleme-kararlari.jsonl, maskeleme-elle.json]
    cikti: [evidence-maskeli/, maskeleme-raporu.json, maskeleme-basarisiz/, maskeleme-bekleyen/]
    komut: ["bidr maskele -w {ws}"]
    sart:
      denetim: kanit_maskele_tamam
      metin: >-
        Bölüm şimdi maskelemeyi seçmişse (config.yaml privacy.maskeleme ya da privacy.mask_before_model; ya da
        kaynak klasör bölüm kaynak maskelemesinin kopyası; çalışma alanındaki eski rapor dosyaları seçim sayılmaz):
        maskeleme-raporu.json ve evidence-maskeli/ var, kanıt klasöründeki her dosya raporda, hiçbiri maskelemeden
        sonra değişmemiş. Değilse bidr maskele (kanıt modu; model yok, otomatik) önerilir. Yeniden koşunun
        gidermeyeceği eksik (karar beklemeyen kaydın maskeli kopyası yok) uyarıdır. Teslimin önkoşulu değildir:
        bidr teslim maskeleme eksik ya da kapalı olsa da paketi üretir ve uyarır. Maskeleme seçili değilse ya da
        teslim modu baglanti iken paket yoksa atlanır. Bölge kararları teslim politikasınındır.
    onay: yok
    skill: bidr-rapor

  - id: teslim
    ad: Teslim paketi (rapor + ölçüt klasörlü kanıtlar + web kanıtlarının PDF kopyası + kanıt dizini; zip)
    uygulandi: true
    istege_bagli: true
    katman: D
    onkosul: [denetle]
    girdi: [report.docx, evidence/, evidence-index.csv, config.yaml rapor.teslim, evidence-maskeli/]
    cikti: [teslim/ (report.docx, kanitlar/, kanit-dizini.xlsx, kanit-dizini.csv), teslim.zip, .bidr-teslim.json]
    komut: ["bidr teslim -w {ws}"]
    sart:
      denetim: teslim_tamam
      metin: >-
        config.yaml rapor.teslim: baglanti ise (birim kanıtları kendisi yükler, raporda bağlantı verir) paket
        istenmedikçe atlanır. dekanlik (varsayılan) ise teslim/ ve teslim.zip güncel report.docx ve kanıt
        dizininden üretilmiş: raporun kanıt listesindeki her satır paketteki bir dosyayla birebir eşleşir, her
        web sayfası kanıtının yanında aynı adla alınma tarihli PDF kopyası var, kanıt dizini (ölçüt, kanıt no,
        OD, ad, paketteki yol, özgün bağlantı, alınma tarihi) yazılmış. Eşleşmeyen satır ya da üretilemeyen PDF
        varsa paket "eksik" (EKSIK.txt) ve aşama bitmez. Özgün adresi bulunamayan web kanıtı uyarıdır
        (dizinde "bağlantı bilinmiyor"; adres uydurulmaz).
    onay: yok
    skill: bidr-rapor

  - id: kor_denetim
    ad: Raporun kör denetimi (isteğe bağlı; iç ölçüm; model işi ajanda, yazandan bağımsız denetçi)
    uygulandi: true
    istege_bagli: true
    katman: M
    onkosul: [render]
    girdi: [texts/, yonler/, evidence-index.csv, audit-olcutler.json, text/, decisions.jsonl (aday belgeler), documents.jsonl]
    cikti: [work/kor_denetim/<anahtar>.json, kor-denetim.json, kor-denetim.md]
    komut:
      - "bidr denetim prepare -w {ws}"
      - "(metni yazmamış, taze denetçi ajan; model Opus) work/kor_denetim/README.md'ye göre her paket için <anahtar>.out.json yaz"
      - "bidr denetim apply -w {ws} --model {ajan}"
    sart:
      denetim: kor_denetim_tamam
      metin: >-
        İstenmediyse (`bidr denetim prepare` çalışmadıysa) atlanır; hat eskisi gibi biter. İstenince her ölçüt
        (birimin doldurduğu, kanıtsız olanlar dahil) ve her alanın yön hücreleri için paket cevaplanmış ve apply ile
        işlenmiş; kor-denetim.json bu turun paketlerinden üretilmiş. Paket yazarın bağlamını içermez (yazım istemi,
        doğrulama gerekçesi, inceleme notu yok). Rapor alıntısı raporda, kanıt alıntısı belgede kodla aranır; tutmayan
        bulgu "doğrulanamadı" olur ve işlenmez. Bulgular metin (kendiliğinden düzeltilir) | od | kanit (bölüm kararı)
        diye sınıflanır. Puan iç ölçümdür, kalite belgesi değildir. Tek tur: otomatik ikinci denetim yok;
        `bidr denetim prepare --ikinci` (ilk turun düzeltmesinden sonra) önce/sonra karşılaştırması veren bir ölçümdür.
        Geçersiz cevap kenara alınıp yeniden istenir; aynı nedenle ikinci ret → o paket denetlenemedi (ölçüm onsuz).
    onay: yok
    skill: bidr-rapor
    paralel:
      bolunebilir: true
      dizin: work/kor_denetim
      duzen: dosya
      anahtar: '(?:[A-E]\.\d+\.\d+|yon_[A-D])'
      gerekce: >-
        Paket tek ölçüt bölümü (metin, atıf yapılan kanıtların metni, aday ama kullanılmamış belgeler) ya da tek alanın yön hücreleri (alanın ölçüt metinleriyle); denetçi başka paketi görmez. Ölçüt arası tutarlılık yön paketinde alan düzeyinde okunur. Denetçi ajanlar metni yazan ve doğrulayan ajanlardan ayrı, taze olmalı.

  - id: duzelt
    ad: Denetim düzeltmeleri (metin bulguları kendiliğinden; OD ve kanıt önerileri bölüm kararıyla)
    uygulandi: true
    istege_bagli: true
    katman: D
    onkosul: [kor_denetim]
    girdi: [kor-denetim.json, kor-denetim-kararlar.jsonl, texts/, yonler/]
    cikti: [work/write/<ölçüt>.json (düzeltme notlu), work/yonler/<alan>.json (düzeltme notlu), kor-denetim-kararlar.jsonl]
    komut:
      - "bidr duzelt prepare -w {ws}"
      - "(insan) OD ve kanıt önerileri: bidr denetim karar -w {ws} <bulgu_id> kabul|ret --not \"…\""
    sart:
      denetim: duzelt_tamam
      metin: >-
        Denetim yoksa atlanır. Doğrulanmış her metin bulgusu (ve kabul edilen OD kararı) düzeltme notu olarak yazım/yön
        paketine girmiş ve yeniden yazılan metin `duzeltme` iziyle kaydedilmiş; yazım kuralları, kod denetimi ve bağımsız
        doğrulama aynen işler (hat write → verify → yonler → render → denetle'ye döner). OD ve kanıt önerilerinin bölüm
        kararı (`bidr denetim karar`; ajan vermez) hattı TUTMAZ: karar verilmemiş öneriler `oneri_bekleyen` ile bilgi
        olarak gösterilir, rapor tamamlandı sayılır. Karar ne zaman gelirse: kabul edilen OD audit okunurken ölçütün
        OD'si olur ve bu aşama yeniden açılır (metin küçük bir düzeltme turunda yeniden yazılır); kabul edilen belge
        ikinci aramaya girer, eşleşirse inceleme tablosunda aday olur. İkinci denetim turu ölçümdür, düzeltme istemez.
    onay: yok
    skill: bidr-rapor
