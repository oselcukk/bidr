# Kanıt ilkeleri: komisyonun verdiği, her belgeye uygulanan genel kararlar.
# İnce karar istemine aynen girer; kurumlar kendi ilkelerini bu dosyayla değiştirebilir.
# Kaynak: bir akademik bölüm kalite komisyonu üyesinin 2026-11-18 kararları.
ilkeler:
  - kimlik: kurum_geneli_duzenleme
    metin: >-
      Kurum (üniversite) geneli yönerge ve yönetmelikler bölüm için kanıttır, ama tek
      başına yalnız kural ve süreç tanımıdır: aşama "planla" (OD2). Bölümün o düzenlemeyi
      uyguladığını gösteren ayrı bir belge (kurul kararı, öğrenci listesi, ilan vb.) yoksa
      "uygula" seçme. Böyle bir belgede "birim_iliskisi": "kurum_geneli" (fakülte geneli
      düzenleme ya da faaliyette "fakulte_geneli") yaz; kod bu belgenin her eşleşmesini OD2 ile
      sınırlar ve "uygulama_kaniti_eksik" diye işaretler. Bölümün kendi usul ve esası/yönergesi
      "kendi"dir, kurum geneli değildir.
  - kimlik: bilgisiz_ekran
    metin: >-
      Bölüm hakkında bilgi içermeyen ekranlar (ör. bilgi sistemi giriş ekranı, yalnız
      bağlantı listesi) kanıt değildir: "kanit_degil".
  - kimlik: bos_form_zinciri
    metin: >-
      Boş anket/form şablonu geri bildirim mekanizmasının kanıtıdır (planla, OD2), "uygula"
      değildir. Anketin sonuçları varsa "uygula" (OD3); sonuçların ölçülüp yorumlanması
      "kontrol_et"; sonuçlara dayanan karar veya değişiklik "onlem_al" (OD4).
  - kimlik: yururlukten_kalkmis
    metin: >-
      Yürürlükten kalktığı metinden anlaşılan ya da açıkça daha yeni bir düzenlemeyle
      değiştirilmiş eski düzenleme kanıt değildir: "kanit_degil"; gerekçede belirt.
  - kimlik: madde_ilkesi
    metin: >-
      Bir düzenleme (yönetmelik, yönerge, usul ve esas) yalnız ilgili maddesi alıntılanabilen
      ölçüte bağlanır; konusu ilgili görünse de karşılayan madde yoksa o ölçüte eşleşme verme.
      Üst birimin çok maddeli kararında (fakülte yönetim kurulu, senato) yalnız bu birimi konu
      alan madde alıntılanır; başka bölümlerin maddeleri bu birimin kanıtı değildir.
  - kimlik: ders_bilgi_formu
    metin: >-
      Ders bilgi formu (izlence) program çıktılarıyla ilişki tablosu, AKTS iş yükü ve ölçme
      ağırlıkları bölümleri varsa B.1.3, B.1.4 ve B.2.2'nin her birine ayrı eşleşmedir (uygula, OD3).
  - kimlik: dis_akreditasyon_raporu
    metin: >-
      Dış akreditasyon için hazırlanmış öz değerlendirme raporları (FEDEK, MÜDEK vb.) programın
      izlenmesinin kanıtıdır; "kanit_degil" sayılmaz. Kanıt sayılmayan BİDR raporlarıdır (bu yılın
      ya da geçen yılların BİDR'si ve taslakları).
  - kimlik: donem_kurali
    metin: >-
      Dönem kuralını kod belge türüne göre uygular; belgenin tarihi rapor yılı dışında diye
      eşleşmeyi reddetme ya da aşamayı düşürme, aşamayı içeriğe göre seç. Yapı belgesi
      (müfredat, ders kataloğu, ders bilgi formu, yönerge, komisyon yapısı, iş akışı, stratejik
      plan) rapor yılında yürürlükteyse kanıttır; yürürlükten kalktığı biliniyorsa yukarıdaki
      ilke gereği "kanit_degil". Olay belgesi (karar, tutanak, anket sonucu, etkinlik, rapor,
      yazışma) önceki yıla aitse kod onu "geçmiş kanıt" olarak ayırır. Belge bir gözden geçirme
      döngüsü tanımlıyorsa (ör. "her 4 yılda bir", "akreditasyon döngüsünde") o cümleyi
      alıntıla: kod döngüyü alıntıdan tanır.
  - kimlik: iyilestirme_kaniti
    metin: >-
      "onlem_al" yalnız bir izleme/değerlendirme sonucuna dayanan ve yapılmış (karara bağlanmış)
      değişikliktir; gerekçede dayandığı sonucu yaz. Öneri, niyet, kurula bilgi verilmesi ve
      sürüm notu ("revize edildi") iyileştirme değildir. Katılım sayısı izleme değildir; tek
      seferlik anket sonucu "kontrol_et" olabilir, OD4 sonuca dayanan iyileştirmeyle tamamlanır.
  - kimlik: ozgunluk_kaniti
    metin: >-
      "ozgun" (OD5) birden çok dönemde sürdürülen ve bağımsızca (üst birim, dış kurum, ödül)
      örnek gösterilen uygulamadır. Bölümün kendi övgü cümlesi ya da tanıtım/web metni ozgun
      değildir. Bölüm kurulu kararı bölüm uygulamasıdır; fotoğraf yalnız destekleyicidir.
