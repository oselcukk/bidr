# Birim profili: fakülteye bağlı akademik bölüm (ör. Matematik Bölümü).
#
# Ölçütün "DOLDURACAK BİRİMLER" (units) metni virgülle öğelere bölünür.
# - dahil: bir öğe bu ifadelerden birini içeriyorsa ölçüt bu birimce doldurulur.
# - belirsiz: dahil eşleşmesi yoksa ve bu ifadelerden biri varsa ölçüt "belirsiz"
#   sayılır; ne yapılacağı `belirsiz_politika` ile (tut | dus) belirlenir.
# - kararlar: ölçüt kimliğine göre elle verilmiş kesin karar (dahil | haric);
#   kurallardan önce gelir. Şef/insan onayıyla doldurulur.
# - kapsam: ölçüt kimliğine göre sorumlu birim kapsamı (render; bidr/render/kapsam.py):
#   bolum | ortak | baska_birim | karar_gerekli. Yazılmayan ölçüt kurallardan türetilir (geri
#   uyumlu): dahil/kararlar:dahil → bolum, belirsiz → karar_gerekli, doldurucu birimler arasında
#   profil yok (haric) → baska_birim. Çalışma alanında kullanıcının kararı config.yaml
#   `rapor.kapsam` ile bunun üstüne yazılır. Aday/karar/audit aşamaları `dahil`/`kararlar`a bakar.
# Eşleme Türkçe büyük harf ve boşluk farkına duyarsızdır.
