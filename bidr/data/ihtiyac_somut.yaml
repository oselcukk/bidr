# Sade "İstenen kanıtlar" listesi (`bidr ihtiyac` → istenen-kanitlar.xlsx): kılavuzun (FR-0833)
# "Örnek Kanıtlar" maddelerinin bölüm düzeyinde, somut belge adlarıyla karşılıkları.
#
# Genel ve kurumdan bağımsızdır (kişi/kurum adı yok); birimin düzenine göre bu dosyanın kopyası
# `--somut` ile verilebilir. Her kayıt: kılavuz maddesi kimliği (`B.3.2/3` = B.3.2'nin 3. örnek
# kanıtı) → 1–3 somut belge. `{yil}` raporun yılıyla değiştirilir. İsteğe bağlı biçim:
#   B.3.2/3: {belgeler: [...], kimden: "Dersi veren öğretim elemanları"}
# Kaydı olmayan madde kılavuz metniyle yazılır. `ozgun`: "özgün uygulama" maddelerinin ortak metni.
surum: 1
ozgun:
  - "Bölüme özgü, örnek gösterilebilir bir uygulamanın belgesi (bölümün kendi başlattığı bir program, anket, etkinlik dizisi ya da çalışma yöntemi): ne yapıldığını ve sonucunu gösteren karar, rapor ya da duyuru"
