  B/35: {yuvalar: [B.1.1/1, B.1.1/2]}             # yeni program başvurusu = program tasarım ve onay süreci
  B/36: {yuvalar: [B.1.5/5]}                      # ders planlarının revizyonu, Senato kararı = izlemeye dayalı iyileştirme
  B/37: {yuvalar: [B.3.2/3, B.3.2/8]}             # danışmanlık sistemi ve danışman değerlendirme anketi ≈ B.3.2/3, B.3.2/8
