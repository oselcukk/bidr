# Kılavuz eki "Örnek Uygulama ve Kanıtlar Listesi" (boş FR-0833 şablonunun sonu; satırlar
# `bidr/data/criteria/ornek-uygulamalar.yaml`, şablondan üretilir) → alt ölçüt eşlemesi.
#
# Şablonda satırlar yalnız alan düzeyindedir (A–D); hangi alt ölçüte ait oldukları yazmaz. Bu eşleme
# elle yapılmıştır: her satırın uygulama ve kanıt metni, alt ölçütün başlığı ve "Örnek Kanıtlar"
# maddeleriyle (yuva, `B.1.2/3` = B.1.2'nin 3. örnek kanıtı) karşılaştırıldı. Gerekçe satır sonundaki
# yorumdur ("≈" = yuva metnine yakın ifade). Kullanım: sade istenen-kanitlar.xlsx'te satır, eşlendiği
# yuvalardan biri karşılanmamışsa öneri olur (bkz. docs/IHTIYAC.md 5).
#
# Alanlar:
#   yuvalar   1–3 kılavuz yuvası (alt ölçüt bunlardan çıkar). "Standart uygulamalar… (özgün)" yuvalarına
#             eşleme yapılmaz.
#   belirsiz  true: eşleme yoruma açık (rapor ve testte listelenir); gerekçe yorumda.
#   sade      false: kurum geneli (kampüs, enstitü, merkezi sistem) bir iş; bölüm düzeyindeki sade
#             listeye öneri olarak girmez (teknik ihtiyac.xlsx'te görünür).
surum: 1
eslesme:
  # A. LİDERLİK, YÖNETİŞİM VE KALİTE
  A/1:  {yuvalar: [A.1.1/1]}                      # organizasyon şeması ≈ "Yönetişim modeli ve organizasyon şeması"
  A/2:  {yuvalar: [A.1.1/1, A.1.4/2]}             # kurul/komisyon kurulması, sorumlu listesi: yapı + görev ve sorumluluklar
  A/3:  {yuvalar: [A.1.4/5, A.4.1/2]}             # periyodik anket = geri bildirim yöntemi / veri toplama aracı
  A/4:  {yuvalar: [A.4.1/4, A.1.4/7]}             # anket analizi ve iyileştirme önlemi = izleme ve iyileştirme kanıtı
  A/5:  {yuvalar: [A.2.2/1]}                      # birim hedeflerinin kurum stratejik planıyla ilişkisi = strateji belgesi
  A/6:  {yuvalar: [A.1.3/4, A.2.2/4], belirsiz: true}  # "gelecek senaryoları" A.1.3/4; plan revizyonu A.2.2 izlemesi
  A/7:  {yuvalar: [A.1.4/4, A.3.4/1], belirsiz: true}  # iç kontrol eylem planı: kılavuzda karşılığı yok; risk planı ve süreç yönetimine en yakın
  A/8:  {yuvalar: [A.3.4/3, A.1.4/2], belirsiz: true}  # faaliyet planında süreçler: süreç yönetimi uygulaması + iş takvimi
  A/9:  {yuvalar: [A.1.4/2]}                      # kalite faaliyet planı, sorumlular ≈ "takvim, görev ve sorumluluklar"
  A/10: {yuvalar: [A.1.5/3, A.1.5/2]}             # faaliyet raporunun web'de paylaşılması = hesap verebilirlik + güncel web
  A/11: {yuvalar: [A.1.5/3, A.1.4/7]}             # BİDR'in web'de paylaşılması = hesap verebilirlik; BİDR yıllık izleme raporudur
  A/12: {yuvalar: [A.1.4/1]}                      # birim kalite komisyonu ≈ "Kalite Komisyonu çalışma usul ve esasları"
  A/13: {yuvalar: [A.2.1/1]}                      # web'de misyon/vizyon ≈ "Misyon ve vizyon"
  A/14: {yuvalar: [A.2.2/1, A.2.3/2]}             # ölçülebilir stratejik plan: plan + performans göstergeleri
  A/15: {yuvalar: [A.2.2/2]}                      # stratejik planda paydaş görüşü ≈ A.2.2/2
  A/16: {yuvalar: [A.2.3/2, A.2.3/1]}             # performans göstergeleri ve takip sorumluları ≈ A.2.3/2
  A/17: {yuvalar: [A.2.2/4, A.2.3/4]}             # gerçekleşme oranları, performans raporu ≈ A.2.2/4, A.2.3/4
  A/18: {yuvalar: [A.1.5/2]}                      # web sayfasının güncel tutulması ≈ A.1.5/2
  A/19: {yuvalar: [A.3.2/2]}                      # personel memnuniyet anketi ≈ "Çalışan memnuniyeti anketleri"
  A/20: {yuvalar: [A.3.4/3, A.3.4/5]}             # süreç kartları: uygulama + izleme/iyileştirme
  A/21: {yuvalar: [A.3.4/4]}                      # süreç kartlarında paydaş görüşü ≈ "Paydaş katılımına ilişkin kanıtlar" (A.3.4)
  A/22: {yuvalar: [A.4.1/1, A.4.1/2]}             # paydaş analizi + sistematik toplantı/anket ≈ paydaş listesi, veri toplama araçları
  A/23: {yuvalar: [A.1.4/5, A.1.5/4]}             # web'de şikâyet/öneri mekanizması = geri bildirim yöntemi; kamuoyu geri bildirimi
  A/24: {yuvalar: [A.4.3/1]}                      # mezun sayısı kaydı, mezun veri tabanı = mezun izleme sistemi
  A/25: {yuvalar: [A.4.3/1, A.4.3/4]}             # sosyal medyayla mezun iletişimi: izleme sistemi + mezun geri bildirimi
  # B. EĞİTİM ÖĞRETİM
  B/1:  {yuvalar: [B.1.5/2]}                      # misyon/vizyon doğrultusunda program ihtiyaçları ≈ B.1.5/2
  B/2:  {yuvalar: [B.1.5/1, B.1.5/5]}             # eğitim planının gözden geçirilip revizyon ihtiyacının belirlenmesi = program izleme
  B/3:  {yuvalar: [B.1.1/5, A.4.1/2]}             # paydaş görüşmeleriyle öğrenci/sektör beklentisi = program tasarımında paydaş katılımı
  B/4:  {yuvalar: [B.1.5/5, B.1.2/3]}             # yeni ders/program, eğitim planı revizyonu ve Senato kararı
  B/5:  {yuvalar: [B.1.2/1, B.1.2/3]}             # seçmeli/zorunlu ders dağılım dengesi = B.1.2 başlığı
  B/6:  {yuvalar: [B.1.4/1, B.1.2/2]}             # program ve ders bilgi paketi sayfaları ≈ "AKTS ders bilgi paketleri"
  B/7:  {yuvalar: [B.1.1/3]}                      # program çıktılarının TYYÇ'ye göre güncellenmesi ≈ B.1.1/3
  B/8:  {yuvalar: [B.1.1/1, A.1.3/3]}             # yeni program için ihtiyaç analizi: program tasarım süreci; değişim analizi
  B/9:  {yuvalar: [B.2.4/2], belirsiz: true}      # yan dal/ÇAP öğrenci beklentisi: B.2.4/2 ÇAP/yandal kabulünü anar; beklenti analizi A.4.2'ye de yakın
  B/10: {yuvalar: [B.2.4/2]}                      # programın yan dal/ÇAP'a uygunluğu: ÇAP/yandal uygulamaları (B.2.4/2)
  B/11: {yuvalar: [B.2.4/2, B.2.3/1]}             # yatay geçiş kontenjan ve şartları ≈ B.2.4/2 "yatay geçiş… kabullerinde"
  B/12: {yuvalar: [B.2.4/2, B.2.3/1]}             # ÇAP/yandal uygulama esasları: kabul kuralları
  B/13: {yuvalar: [B.2.3/2, B.2.3/3, B.1.4/3]}    # ders eşdeğerlik ve intibak = önceki öğrenmenin tanınması
  B/14: {yuvalar: [B.1.4/2]}                      # staj yapılacak programlar ≈ "iş yükü kredisinin… staj… için tanımlandığı"
  B/15: {yuvalar: [B.1.4/2], belirsiz: true}      # programın staj altyapısına uygunluğu: staj tanımı; altyapı (B.3.3) de olabilir
  B/16: {yuvalar: [B.1.4/2, B.1.5/5]}             # müfredatta staj dersi revizyonu: staj kredisi + program güncellemesi
  B/17: {yuvalar: [B.1.4/2, B.1.6/2]}             # staj yönergesi: staj tanımı + eğitim süreçlerinin kuralları
  B/18: {yuvalar: [B.1.6/1]}                      # iş akışlarının hazırlanması ≈ "organizasyonel yapılanma ve iş akış şemaları" (B tablosunda)
  B/19: {yuvalar: [B.1.4/2, B.3.2/6], belirsiz: true}  # işletmelerle staj olanakları/protokoller: staj + kariyer uygulamaları; dış paydaş iş birliği de olabilir
  B/20: {yuvalar: [B.1.4/2, B.1.6/4], belirsiz: true}  # stajyerin staj yerinde denetimi: kılavuzda doğrudan yok; staj uygulamasının izlenmesi
  B/21: {yuvalar: [A.4.2/2, B.1.5/7], belirsiz: true}  # tercih sebepleri anketi, YÖK Atlas: öğrenci geri bildirimi; kıyaslama (A.1.3/5) da olabilir
  B/22: {yuvalar: [A.4.2/2, B.1.5/7]}             # öğrenci memnuniyeti anketi = öğrenci geri bildirim mekanizması
  B/23: {yuvalar: [B.1.5/3, B.1.6/5]}             # mevcut durum, sorunlar, öneriler raporu ≈ öz değerlendirme / değerlendirme raporu
  B/24: {yuvalar: [B.2.3/4], belirsiz: true}      # program tanıtımı (broşür, video): aday öğrenci bilgilendirmesi; A.1.5 de olabilir
  B/25: {yuvalar: [B.3.5/1, B.3.5/5]}             # öğrenci toplulukları: sosyal faaliyetlerin yürütülmesi ve çeşitlendirilmesi
  B/26: {yuvalar: [B.3.5/1, B.3.5/3]}             # topluluk web/sosyal medya hesapları: faaliyetlerin duyurulması, erişilebilirliği
  B/27: {yuvalar: [B.3.2/1, B.3.4/1], belirsiz: true}  # burs ve konaklama desteği: kılavuzda doğrudan yok; öğrenci destek hizmeti / dezavantajlı öğrenci
  B/28: {yuvalar: [A.4.3/1], sade: false}         # mezun bilgi sistemi kurulması: kurum geneli sistem ≈ "Mezun izleme sisteminin özellikleri"
  B/29: {yuvalar: [B.3.3/5, B.3.1/1]}             # altyapı ve öğretim elemanı olanaklarının değerlendirilmesi = tesis/kaynak izleme
  B/30: {yuvalar: [B.1.5/2, A.1.3/2], belirsiz: true}  # akreditasyon için yapılacakların tespiti: program güncelleme mekanizması / yol haritası
