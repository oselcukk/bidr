  B/48: {yuvalar: [B.3.3/3, B.3.3/5]}             # derslik başına öğrenci sayısına göre iyileştirme ≈ B.3.3/3 örneği
  B/49: {yuvalar: [B.3.3/3], belirsiz: true, sade: false}  # açık/yeşil alan envanteri: kampüs düzeyi; kılavuzda doğrudan yok
