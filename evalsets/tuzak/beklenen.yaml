      - {olcut: B.3.2, yuva: B.3.2/5, asama: planla,
         alinti: "Örnek Bölümü, lisans öğrencilerinin kariyer planlamasına destek olmak amacıyla 9 Nisan 2025 Çarşamba günü saat 13.30'da Bölüm Seminer Salonunda bir Kariyer Günü düzenleyecektir."}
