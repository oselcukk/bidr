# Tuzak seti: beklenen sonuçlar. Biçim: evalsets/README.md "beklenen.yaml".
#
# Hayalî birim: Örnek Üniversitesi · Örnek Fakültesi · Örnek Bölümü (başka birim: Kıyas
# Bölümü). Rapor yılı 2025. Gerçek kurum, kişi adı, e-posta yok.
#
# Belge alanları:
#   kanit          evet | hayir | gecmis (önceki yıl olayı: süreklilik, bu yılın halkası değil)
#                  | dogrulanmali (tarihsiz olay: tarih doğrulanmadan sayılmaz)
#   en_yuksek_od   bu belgeye dayanarak RAPOR YILI için savunulabilecek en yüksek OD
#                  (sayılan halkanın OD'si; kanıt değilse ya da sayılmıyorsa 1)
#   eslesmeler     doğru çalışan bir ince kararın vermesi beklenen eşleşmeler (ideal)
#   naif           tuzağa düşen bir modelin vereceği kayıt (kod tek başına yakalıyor mu?)
#   bilinen_acik   naif kaydı kodun (audit) yakalayamadığının gerekçesi; testte xfail
#   yazilmamali    bu belgeye dayanarak yazılmaması gereken iddialar; `anahtar` ifadelerden
#                  biri, belgeye atıf yapan cümlede geçerse ihlal (atif_sart: false → hangi
#                  atıfla olursa olsun); `haric` ifadelerden biri cümledeyse ihlal sayılmaz
surum: 1
set: tuzak
birim: Örnek Bölümü
kurum: Örnek Üniversitesi
donem: 2025

olcutler:
  # Ölçüt OD'si: setteki bütün belgeler doğru işlendiğinde (ideal) beklenen düzey ve bir üst
  # düzey için eksik halkalar.
  A.4.2: {od: 4, eksik: [ozgun], gerekce: "boş form (P) + sonuçlar (U) + sonuca dayalı komisyon kararı (K+Ö)"}
  A.4.3: {od: 3, eksik: [kontrol_et, onlem_al], not_icermeli: ["plan belgesi önerilir"],
          gerekce: "yalnız iki (çelişkili) sonuç belgesi: uygulama; plan örtük"}
  B.1.3: {od: 2, eksik: [uygula], gerekce: "inceleme kararı (P), web beyanı (P), komisyon incelemesi (K); ilişkilendirmenin uygulandığını gösteren belge yok"}
  B.1.4: {od: 2, eksik: [uygula], gerekce: "2025 staj esasları (P); 2024 staj kararı geçmiş kanıt; fakülte raporu OD2 tavanı"}
  B.1.5: {od: 3, eksik: [kontrol_et, onlem_al], gerekce: "FYK madde 2 (U); 2026 kararı dönem sonrası; tarihsiz tutanak sayılmaz"}
  B.2.2: {od: 3, eksik: [kontrol_et, onlem_al], gerekce: "kurum yönergesi (P) + sınav takvimi (U, üç sürüm tek kanıt)"}
  B.3.2: {od: 3, eksik: [kontrol_et, onlem_al], gerekce: "danışmanlık yönergesi ve duyurular (P) + danışman atama kararı (U)"}
  B.3.5: {od: 3, eksik: [kontrol_et, onlem_al], gerekce: "duyuru (P) + sonuç raporu (U)"}
  B.1.1: {od: 1, gerekce: "tek belge başka bölümün kararı"}
  A.1.4: {od: 1, gerekce: "geçen yılın BİDR taslağı kanıt değildir"}
  B.1.6: {od: 1, gerekce: "bilgi sistemi giriş ekranı kanıt değildir"}

surum_gruplari:
  - {ad: sinav-takvimi, belgeler: [t15-sinav-takvimi-taslak.md, t16-sinav-takvimi-15-ekim.md, t17-sinav-takvimi-kesin.md],
     temsilci: t17-sinav-takvimi-kesin.md}

celiskiler:
  - {belgeler: [t07-mezun-anketi-komisyon-raporu.md, t08-faaliyet-raporu-ozeti.md],
     konu: "mezun memnuniyeti: komisyon raporunda %78, faaliyet raporu özetinde %87"}

