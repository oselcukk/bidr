        belge_turu: yonerge
        tarih: "2022-09-08"
        kanit: evet
        birim_iliskisi: kurum_geneli
        en_yuksek_od: 2
        eslesmeler:
          - {olcut: B.2.3, yuva: B.2.3/1, asama: planla,
             alinti: "Muafiyet talepleri, dersin içeriği ve AKTS iş yükü karşılaştırılarak ilgili bölümün muafiyet ve intibak komisyonunca değerlendirilir."}
        naif:
          birim_iliskisi: kendi
          eslesmeler:
            - {olcut: B.2.3, yuva: B.2.3/3, asama: uygula,
               alinti: "Muafiyet talepleri, dersin içeriği ve AKTS iş yükü karşılaştırılarak ilgili bölümün muafiyet ve intibak komisyonunca değerlendirilir."}
      - dosya: v02-kurum-yonergesi-ve-bolum-uygulamasi/b-intibak-komisyonu-tutanagi.md
        belge_turu: komisyon_tutanagi
        tarih: "2025-09-18"
        kanit: evet
        birim_iliskisi: kendi
        en_yuksek_od: 3
        eslesmeler:
          - {olcut: B.2.3, yuva: B.2.3/2, asama: uygula,
             alinti: "14 dersten muafiyet verilmesine, 2 ders için muafiyet talebinin AKTS iş yükü yetersiz olduğundan reddedilmesine karar verilmiştir."}
      - dosya: v02-kurum-yonergesi-ve-bolum-uygulamasi/c-yatay-gecis-duyurusu.md
        belge_turu: web_sayfasi
        tarih: "2025-07-01"
        kanit: evet
        birim_iliskisi: kendi
        en_yuksek_od: 3
