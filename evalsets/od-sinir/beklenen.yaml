# OD sınır seti: ölçüt başına küçük belge kümeleri ve doğru OD. Biçim: evalsets/README.md.
#
# Hayalî birim: Örnek Üniversitesi · Örnek Bölümü (başka birim: Kıyas Bölümü). Rapor yılı 2025.
# Her vaka tek bir ölçütü sınar; vakalar ayrı ölçütlerde olduğundan set tek çalışma alanında
# da işlenebilir.
#
# Vaka alanları:
#   beklenen_od    bütün belgeler doğru işlendiğinde ölçütün OD'si (rubrik + docs/AUDIT.md)
#   eksik_halka    bir üst düzey için eksik halkalar (audit-olcutler.json `eksik[].halka`)
#   eksik_kosul    eksik koşulun insan okur açıklaması
#   not_icermeli   ölçüt notlarında geçmesi gereken ifade(ler)
#   bilinen_acik   naif kayıtla audit'in yanlış OD verdiği bilinen açık (testte xfail gerekçesi)
#   kapanan_acik   eskiden bilinen açıktı, kod tarafı savunma kapattı (bilgi; test normal çalışır)
# Belge alanları tuzak setindekiyle aynı (eslesmeler = ideal, naif = tuzağa düşen model).
surum: 1
set: od-sinir
birim: Örnek Bölümü
# kurumun bilinen birim adları: başka birim adı yalnız bunlardan tanınır (config `birim_adlari`)
birim_adlari: [Örnek Bölümü, Kıyas Bölümü]
kurum: Örnek Üniversitesi
donem: 2025

vakalar:
  - id: plansiz-uygulama
    olcut: B.3.5
    beklenen_od: 3
    eksik_halka: [kontrol_et, onlem_al]
    eksik_kosul: >-
      Plan belgesi yok: OD2 örtük sağlanır (komisyon kararı 2026-11-18), ölçüt "plan belgesi
      önerilir" diye işaretlenir. OD4 için faaliyetlerin izlenmesi ve taleplere göre iyileştirme gerekir.
    not_icermeli: ["plan belgesi önerilir"]
    belgeler:
      - dosya: v01-plansiz-uygulama/a-faaliyet-raporu-2025.md
        belge_turu: faaliyet_raporu
        tarih: "2025-12-22"
        kanit: evet
        birim_iliskisi: kendi
        en_yuksek_od: 3
        eslesmeler:
          - {olcut: B.3.5, yuva: B.3.5/2, asama: uygula,
             alinti: "2025 yılında bölüm öğrenci topluluğu ile birlikte dört sosyal etkinlik düzenlenmiştir"}
      - dosya: v01-plansiz-uygulama/b-satranc-turnuvasi-katilim.md
        belge_turu: katilim_listesi
        tarih: "2025-04-12"
        kanit: evet
        birim_iliskisi: kendi
        en_yuksek_od: 3
        eslesmeler:
          - {olcut: B.3.5, yuva: B.3.5/2, asama: uygula,
             alinti: "toplam 28 öğrenci katılmıştır."}
        naif:
          eslesmeler:
            - {olcut: B.3.5, yuva: B.3.5/5, asama: kontrol_et,
               alinti: "toplam 28 öğrenci katılmıştır."}
      - dosya: v01-plansiz-uygulama/c-bahar-piknigi-haberi.md
        belge_turu: web_sayfasi
        tarih: "2025-05-19"
        kanit: evet
        birim_iliskisi: kendi
        en_yuksek_od: 3
        eslesmeler:
          - {olcut: B.3.5, yuva: B.3.5/3, asama: uygula,
             alinti: "Ulaşımı güç olan öğrenciler için bölüm aracı ayrıldı."}

